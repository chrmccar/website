<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christopher McCarthy</title>
<style>
  :root {
    --bg: #0b1014;
    --text: #dbe4d6;      /* name, headings */
    --soft: #a3b3a7;      /* body text, links */
    --dim: #6f8078;       /* close button */
    --accent: #ecd24a;    /* the cockatoo's crest */
    --mono: "JetBrains Mono", "Fira Code", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: var(--mono); color: var(--soft); }

  /* the animated scene fills the whole window, behind everything */
  #tree { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }

  /* ---- name (top left) and menu (top right), sitting in the sky ---- */
  .masthead {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
    gap: 10px 28px; padding: 22px 28px;
    pointer-events: none;                 /* clicks fall through to the scene... */
    text-shadow: 0 0 6px var(--bg), 0 0 14px var(--bg);
  }
  .masthead a { pointer-events: auto; }   /* ...except on the links */
  .masthead h1 {
    margin: 0; font-size: 19px; font-weight: 500; letter-spacing: 0.16em;
    color: var(--text); white-space: nowrap;
  }
  nav { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; letter-spacing: 0.08em; }
  nav a { color: var(--soft); text-decoration: none; padding: 4px 0; }
  nav a::before { content: "["; opacity: 0; margin-right: 3px; color: var(--accent); }
  nav a::after  { content: "]"; opacity: 0; margin-left: 3px;  color: var(--accent); }
  nav a:hover, nav a:focus-visible, nav a[aria-current="true"] { color: var(--text); outline: none; }
  nav a:hover::before, nav a:hover::after,
  nav a:focus-visible::before, nav a:focus-visible::after,
  nav a[aria-current="true"]::before, nav a[aria-current="true"]::after { opacity: 1; }

  /* ---- content panels: slide in over the right of the scene ---- */
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 2;
    box-sizing: border-box; padding: 96px 30px 30px; overflow-y: auto;
    background: rgba(11, 16, 20, 0.88); border-left: 1px solid #1f2b2e;
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    transform: translateX(100%); visibility: hidden;
    transition: transform 0.35s ease, visibility 0s linear 0.35s;
    font-size: 13.5px; line-height: 1.75;
  }
  .panel.open { transform: none; visibility: visible; transition: transform 0.35s ease; }
  .panel h2 { margin: 0 0 18px; font-size: 14px; font-weight: 500; letter-spacing: 0.16em; color: var(--text); }
  .panel h2::before { content: "/ "; color: var(--accent); }
  .panel p { margin: 0 0 16px; }
  .panel a { color: var(--text); }
  .panel .close {
    position: absolute; top: 90px; right: 26px; background: none; border: 0; cursor: pointer;
    font: inherit; font-size: 13px; letter-spacing: 0.08em; color: var(--dim); padding: 4px;
  }
  .panel .close:hover, .panel .close:focus-visible { color: var(--text); outline: none; }

  @media (max-width: 640px) {
    .masthead { padding: 16px 18px; }
    .masthead h1 { font-size: 16px; letter-spacing: 0.12em; }
    .panel { padding: 110px 22px 24px; border-left: 0; background: rgba(11, 16, 20, 0.93); }
    .panel .close { top: 104px; right: 18px; }
  }
  @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>
</head>
<body>
<canvas id="tree" role="img"
  aria-label="Animated text art of a dry forest: Callitris rhomboidea trees swaying in the wind, with a wallaby and cockatoos passing through"></canvas>

<!-- ================= NAME AND MENU ================= -->
<header class="masthead">
  <h1 id="name">Christopher McCarthy</h1>
  <nav aria-label="Sections">
    <a href="#about">about</a>
    <a href="#contact">contact</a>
  </nav>
</header>

<!-- ================= CONTENT PANELS =================
     Each <section> opens when its menu link is clicked. Replace the
     text in [square brackets] with your own. To add a section later,
     copy one, give it a new id, and add a matching link in the menu. -->
<section class="panel" id="about" aria-labelledby="about-h">
  <button class="close" type="button">close &times;</button>
  <h2 id="about-h">about</h2>
  <p>[Your text here.]</p>
</section>

<section class="panel" id="contact" aria-labelledby="contact-h">
  <button class="close" type="button">close &times;</button>
  <h2 id="contact-h">contact</h2>
  <p>[Your contact details here.]</p>
</section>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------
   SETTINGS: the things you are most likely to want to change
------------------------------------------------------------------ */
const CONFIG = {
  fontSize: 11,             // px. Smaller = more characters = a bigger, finer tree
                            // next to the wallaby (which is a fixed number of rows tall)
  fontFamily: '"JetBrains Mono", "Fira Code", Menlo, Consolas, "DejaVu Sans Mono", monospace',
  fps: 30,
  seed: 11,                 // change for a different individual tree
  wind: 1.0,                // 0 = still air, 2 = blustery
  pointerWind: true,        // moving the mouse left/right pushes the wind
  caption: '',              // text shown bottom-left, e.g. 'Callitris rhomboidea' ('' = none)
  // The Callitris trees, nearest first. For each one:
  //   x         where it stands across the view (0 = left edge, 1 = right edge)
  //   size      height compared with the main tree
  //   distance  0 = close, 1 = far away (fainter, and its base sits slightly higher)
  //   base      how far up the trunk the foliage starts (fraction of height)
  //   width     how broad the crown is
  //   shoulders small = sides nearly parallel (columnar), large = widest low down (conical)
  //   taper     small = blunt top, large = long drawn-out point
  //   nod       which way the leading shoot leans: 1 right, -1 left
  //   health    1 = healthy (the default), 0.5 = sickly and thinning, 0 = dead and bare
  trees: [
    { x: 0.42, size: 1.00, distance: 0.00, base: 0.08, width: 0.22, shoulders: 0.30, taper: 0.65, nod:  1 },
    { x: 0.72, size: 0.72, distance: 0.45, base: 0.18, width: 0.17, shoulders: 0.20, taper: 0.50, nod: -1 },
    { x: 0.16, size: 0.50, distance: 0.85, base: 0.05, width: 0.30, shoulders: 0.48, taper: 0.95, nod:  1 },
    { x: 0.90, size: 0.60, distance: 0.65, base: 0.12, width: 0.20, shoulders: 0.36, taper: 0.85, nod: -1 },
    { x: 0.57, size: 0.38, distance: 1.00, base: 0.10, width: 0.27, shoulders: 0.26, taper: 0.55, nod:  1 },
    // drought-killed: mostly bare grey branches with patches of browned foliage
    { x: 0.285, size: 0.64, distance: 0.30, base: 0.10, width: 0.20, shoulders: 0.30, taper: 0.70, nod: -1, health: 0.15 }
  ],
  ridge: true,              // a distant hill line behind the forest
  stars: true,              // a few faint stars in the open sky
  groundDetail: true,       // boulders and a fallen log on the forest floor
  forest: true,             // false = just the single tree, as before
  forestTrees: 1.0,         // how many dim background trees (0 = none, 2 = lots)
  understory: 1.0,          // size of the grassy tussocks along the ground (0 = none)
  wallaby: true,            // a wallaby hops through now and then (click to call one)
  wallabyEvery: [20, 50],   // seconds between visits: shortest, longest
  cockatoos: true,          // a pair of white cockatoos flies over now and then
  cockatooEvery: [25, 60],  // seconds between fly-overs: shortest, longest
  cockatooSize: 1.0,
  wallabySize: 1.0,         // 1 = about nine rows of text tall
  wallabyLook: true,        // stops part-way across and looks out at the viewer
  wallabyWait: 1.0,         // seconds it holds the look before hopping on
  colors: {
    // forest layers, kept deliberately dim so the Callitris stays the subject
    ridge: ['#121f26', '#27404a'],              // distant hill: slope, crest
    star: ['#3d4c5c', '#7f90a3', '#c9d3de'],    // dim -> bright
    rock: ['#3c4548', '#566064', '#8c979a'],    // shaded -> lit
    lichen: '#9aa68a',
    log: ['#5d5044', '#93816c', '#b39b7c'],     // bark, lit bark, cut end
    far: ['#1a2c34', '#243b40'],                // distant misty canopy
    midTrunk: '#39403f',                        // background trunks
    midCrown: ['#1c342f', '#28473b'],           // background crowns
    shrub: ['#414f2e', '#5c6b39', '#7d8a49'],   // tussock leaves: tough olive green, shaded -> lit
    straw: ['#7a6c46', '#a39160'],              // dead leaves and old flower spikes
    bg: '#0b1014',
    // foliage, shaded side -> sunlit side
    foliage: ['#1f3f38', '#2a5344', '#376a50', '#4a8360', '#6c9f7a', '#96bd98'],
    barkLight: '#9a8b78',
    barkDark: '#65584c',
    cone: '#c0905f',
    // browned, drought-killed foliage, shaded -> lit
    deadFoliage: ['#3b2d24', '#574030', '#755438', '#91663f', '#ab7b4a', '#c2955f'],
    deadWood: '#8b8a84',
    wallaby: '#a3978a',       // grey-brown coat
    wallabyNeck: '#b3805f',   // reddish neck and shoulders
    wallabyDark: '#3a332e',   // eye, in profile
    cockatoo: '#f0ece2',
    cockatooCrest: '#ecd24a',
    cockatooBeak: '#5f5c5a',
    wallabyEye: '#f1e8d2',    // eyes, when it looks at you
    grass: '#7d8f55',
    ground: '#6b6a4a',
    air: '#243240',
    caption: '#56636f'
  }
};

/* ------------------------------------------------------------------
   Noise helpers
------------------------------------------------------------------ */
const SEED = CONFIG.seed | 0;

function hash3(x, y, z) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^
          Math.imul(z, 1440662683) ^ Math.imul(SEED, 974634777);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const w = zf * zf * (3 - 2 * zf);
  const a = hash3(xi, yi, zi),         b = hash3(xi + 1, yi, zi);
  const c = hash3(xi, yi + 1, zi),     d = hash3(xi + 1, yi + 1, zi);
  const e = hash3(xi, yi, zi + 1),     f = hash3(xi + 1, yi, zi + 1);
  const g = hash3(xi, yi + 1, zi + 1), h = hash3(xi + 1, yi + 1, zi + 1);
  const x1 = a + (b - a) * u, x2 = c + (d - c) * u;
  const x3 = e + (f - e) * u, x4 = g + (h - g) * u;
  const y1 = x1 + (x2 - x1) * v, y2 = x3 + (x4 - x3) * v;
  return y1 + (y2 - y1) * w;
}

/* ------------------------------------------------------------------
   Character sets. Callitris foliage is fine and thread-like on
   ascending branches, so the glyphs are thin and the outer sprays
   slant upward and outward: \ on the left of the trunk, / on the right.
------------------------------------------------------------------ */
// outermost branchlets droop at the tips, so the slant flips at the edge
const EDGE_L  = ['/', ',', ';', '.', '/', ',', ':'];
const EDGE_R  = ['\\', ',', ';', '.', '\\', ',', ':'];
const MID_L   = ['\\', ';', '!', ':', 'i', '\\', 'l', ';'];
const MID_R   = ['/', ';', '!', ':', 'i', '/', 'l', ';'];
const DENSE   = ['i', 'l', '!', '|', 't', ';', '%', '&', '*', 'f'];
const BARK    = ['|', '|', '|', '!', '|', ':', 'I', '|'];
const SURFACE = ['_', '_', '_', '_', '.', '_', ',', '-', '_', ' '];

/* ------------------------------------------------------------------
   Canvas / grid set-up
------------------------------------------------------------------ */
const canvas = document.getElementById('tree');
const ctx = canvas.getContext('2d');
const reducedMotion = window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let cols = 0, rows = 0, cw = 8, ch = 16;   // grid size and cell size (px)
let groundRow = 0, treeH = 40, cx = 0, aspect = 0.5;
let W = 0, H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  if (!W || !H) return;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // shrink the font on small screens so the tree keeps enough rows
  const fs = Math.max(8, Math.min(CONFIG.fontSize, Math.floor(H / 42)));
  ctx.font = fs + 'px ' + CONFIG.fontFamily;
  ctx.textBaseline = 'top';
  cw = ctx.measureText('M').width;
  ch = Math.round(fs * 1.25);
  cols = Math.ceil(W / cw);
  rows = Math.floor(H / ch);
  aspect = cw / ch;

  groundRow = rows - 3;
  // tree height in rows: as tall as fits, but never wider than the screen
  treeH = Math.max(12, Math.min(groundRow - 2,
                                Math.floor(cols * 0.8 * aspect / 0.22)));
  cx = Math.floor(cols / 2);
  buildTrees();
  buildForest();
  if (reducedMotion) draw(0);
}

/* ------------------------------------------------------------------
   The Callitris trees
------------------------------------------------------------------ */
let trees = [];
let tC = ' ', tColor = '', tD = -1;     // what treeAt() found in the last cell it looked at

function fade(hex, f) {                 // blend a colour towards the background
  const a = parseInt(hex.slice(1), 16), b = parseInt(CONFIG.colors.bg.slice(1), 16);
  const m = sh => Math.round((a >> sh & 255) + ((b >> sh & 255) - (a >> sh & 255)) * f);
  return 'rgb(' + m(16) + ',' + m(8) + ',' + m(0) + ')';
}

function buildTrees() {
  const C = CONFIG.colors;
  trees = CONFIG.trees.map((t, k) => {
    const h = Math.max(8, treeH * t.size);
    const f = t.distance * 0.42;
    return {
      k: k, x: Math.round(cols * t.x), h: h, size: t.size, distance: t.distance,
      baseRows: Math.round(t.distance * 2.4),
      base: t.base, width: t.width, shoulders: t.shoulders, taper: t.taper, nod: t.nod,
      reach: Math.ceil((t.width * 1.05 + 0.13) * h / aspect),
      health: t.health === undefined ? 1 : t.health,
      fol: C.foliage.map(c => fade(c, f)),
      dead: C.deadFoliage.map(c => fade(c, f)), wood: fade(C.deadWood, f),
      barkLight: fade(C.barkLight, f), barkDark: fade(C.barkDark, f), cone: fade(C.cone, f)
    };
  });
  trees.sort((a, b) => a.distance - b.distance);      // nearest first, so it is drawn in front
}

/* Is part of tree T in this cell? If so, sets tC / tColor and returns true.
   Always sets tD: how deep inside that tree's crown outline the cell is. */
function treeAt(T, i, j, t) {
  tD = -1;
  const di = i - T.x;
  if (di > T.reach || di < -T.reach) return false;
  const tj = groundRow - T.baseRows - j;
  const v = tj / T.h;                               // 0 at the ground, 1 at the tip
  if (v <= 0 || v > 1.02) return false;
  const unit = aspect / T.h;                        // one column, in tree-height units

  // the tree bends more the higher you go, with a little whip at the top
  const bend = wind * 0.045 * v * v + Math.sin(t * 1.9 + v * 5 + T.k * 2.1) * 0.004 * v * wind;
  // the leading shoot nods over at the very top
  const tip = Math.max(0, (v - 0.86) / 0.14);
  const nod = T.nod * 0.024 * tip * tip * (1 + 0.5 * wind * T.nod);
  // crown half-width at this height
  const s = (v - T.base) / (1 - T.base);
  const cw_ = (s > 0 && s < 1) ? T.width * Math.pow(s, T.shoulders) * Math.pow(1 - s, T.taper) : 0;

  const u = di * unit - bend - nod;                 // sideways distance from the trunk
  const au = Math.abs(u);
  const left = u < 0;
  // "home" cell in the tree's own frame, so details travel with the sway
  const ti = Math.round(u / unit), z = T.k * 37;

  let D = -1, d = -1, n = 0.5;
  if (cw_ > 1e-4) {
    d = 1 - au / cw_;                               // 1 on the axis, 0 at the crown edge
    if (d > -0.7) {
      // clumps stretched along ascending branches (constant q)
      const q = v - au * 1.4;
      n = 0.62 * noise3(q * 30 + z, au * 14 + (left ? 0 : 17.3), t * 0.22) +
          0.38 * noise3(u * 70 + 9, v * 45 + z, t * 0.5);
      D = d * 1.15 + (n - 0.5) * 1.05;
    }
  }
  tD = d;

  const sick = 1 - T.health;
  // an unhealthy tree has lost foliage, most of all from the outside in
  if (D > 0.07 + sick * (0.5 + 0.25 * (1 - d))) {
    /* ---------- foliage ---------- */
    const shimmer = noise3(i * 0.7, j * 0.7, t * 0.8);
    const pick = (hash3(ti, tj, 1 + z) + shimmer) % 1;
    const k = D + (shimmer - 0.5) * 0.3;
    const set = k < 0.32 ? (left ? EDGE_L : EDGE_R)
              : k < 0.7  ? (left ? MID_L : MID_R)
              : DENSE;
    tC = set[Math.floor(pick * set.length)];
    // light from the upper left; outer sprays a little paler
    let light = 0.48 - (u / cw_) * 0.3 + (v - 0.5) * 0.15 + (n - 0.5) * 0.9;
    light = Math.max(0, Math.min(0.999, light));
    // what foliage is left on a sick tree is mostly browned off
    const alive = sick === 0 || hash3(ti >> 1, tj >> 1, 5 + z) < T.health * 0.8;
    tColor = (alive ? T.fol : T.dead)[Math.floor(light * T.fol.length)];
    // seed cones, clustered on the older wood inside the crown
    if (D > 0.3 + sick * 0.3 && d > 0.1 && d < 0.8 &&
        noise3(ti * 0.13 + z, tj * 0.13, 40) > 0.6 && hash3(ti, tj, 2 + z) < 0.09) {
      tC = 'o';
      tColor = T.cone;
    }
    return true;
  }
  const tw = Math.max(unit * 0.5, 0.011 * (1 - 0.8 * v) + 0.012 * Math.exp(-v * 28));
  if (v < 0.97 && au < tw) {
    tC = BARK[Math.floor(hash3(ti, tj >> 1, 3 + z) * BARK.length)];
    tColor = left ? T.barkLight : T.barkDark;
    return true;
  }
  if (d > 0.3 - sick * 0.28 && hash3(ti, tj, 4 + z) < 0.45 + sick * 0.2 * d) {
    tC = left ? '\\' : '/';                         // branch glimpsed through a gap
    tColor = sick > 0.4 ? T.wood : T.barkDark;      // bleached grey on a dead tree
    return true;
  }
  return false;
}

/* ------------------------------------------------------------------
   Forest backdrop: three quiet layers behind and beside the main tree
     far   - a distant canopy line dissolving into mist
     mid   - a few dim, open-crowned trees standing further back
     shrub - strappy tussocks along the ground (loosely Lomandra longifolia
             as it grows in dry forest: upright, ragged, part straw-coloured)
------------------------------------------------------------------ */
const FAR_CH   = ['.', ':', '.', "'", ',', '.'];
const CROWN_CH = ['.', ':', ';', "'", '"', ',', ':'];
let farH = [], ridgeH = [], midTrees = [];
let colO = new Int16Array(0), objects = [];
let oC = ' ', oColor = '';              // what objectAt() found
let tussocks = [], colT = new Int16Array(0);
let sC = ' ', sColor = '';              // what tussockAt() found

function buildForest() {
  farH = new Float32Array(cols);
  ridgeH = new Float32Array(cols);
  midTrees = [];
  if (CONFIG.ridge) for (let i = 0; i < cols; i++) {
    ridgeH[i] = treeH * (0.6 + 0.22 * noise3(i * 0.012, 11.3, 0) + 0.05 * noise3(i * 0.07, 12.1, 0));
  }
  buildGround();
  if (!CONFIG.forest) return;

  for (let i = 0; i < cols; i++) {
    // skyline: long rolling shape plus small bumps for individual treetops
    const bump = noise3(i * 0.55, 8.3, 0);
    farH[i] = treeH * (0.34 + 0.24 * noise3(i * 0.035, 7.1, 0)) + 3 * bump * bump;

  }
  buildTussocks();

  // background trees: one per slot across the width, none behind the main crown
  const n = Math.round(cols / 24 * CONFIG.forestTrees);
  for (let k = 0; k < n; k++) {
    const x = (k + 0.2 + 0.6 * hash3(k, 1, 20)) * cols / n;
    if (trees.some(T => Math.abs(x - T.x) < T.width * 0.6 * T.h / aspect + 12)) continue;
    midTrees.push({
      x: x,
      h: treeH * (0.62 + 0.5 * hash3(k, 2, 20)),   // rows from ground to crown centre
      rx: 6 + 6 * hash3(k, 3, 20),                 // crown radii, in columns / rows
      ry: 3.5 + 3.5 * hash3(k, 4, 20),
      lean: (hash3(k, 5, 20) - 0.5) * 0.12,
      wide: hash3(k, 6, 20) < 0.35,
      k: k
    });
  }
}

/* ------------------------------------------------------------------
   Wallaby. Built as a little skeleton of tapered "sausages" (body,
   haunch, hind leg, tail, neck, head, ears, forearm). Each text cell
   checks how much of itself the animal covers and picks a character
   to match, so the silhouette animates smoothly as the pose changes.
   Units: 1 = roughly the animal's standing height.
------------------------------------------------------------------ */
const RAD = Math.PI / 180;
const HOP_TIME = 0.62;      // seconds per hop
const HOP_LENGTH = 1.9;     // body-heights travelled per hop
const HOP_HEIGHT = 0.42;    // body-heights off the ground
const FUR = ['%', '&', '#', '%', '&', '%', '#', '&'];

let wallaby = null, nextWallaby = -1;

function spawnWallaby(t) {
  if (wallaby || !cols || !CONFIG.wallaby) return;
  const dir = Math.random() < 0.5 ? 1 : -1;
  const S = ch * 8.5 * CONFIG.wallabySize;          // pixels per body-height
  const x0 = dir > 0 ? -S : W + S;
  // pick a spot somewhere across the middle of the view to stop and look
  let target = W * (0.22 + 0.56 * Math.random());
  // ...but not right in front of the tree
  for (const T of trees) {
    const tx = T.x * cw, gap = W * 0.11 * T.size;
    if (Math.abs(target - tx) < gap) target = tx + (target < tx ? -gap : gap);
  }
  const stopHop = Math.max(1, Math.round(Math.abs(target - x0) / (HOP_LENGTH * S)));
  wallaby = { t0: t, dir: dir, S: S, x0: x0, stopHop: stopHop };
}

// value at "a" along a list of [position, value] keyframes
function key(a, k) {
  for (let i = 1; i < k.length; i++) {
    if (a <= k[i][0]) {
      const f = (a - k[i - 1][0]) / (k[i][0] - k[i - 1][0]);
      return k[i - 1][1] + (k[i][1] - k[i - 1][1]) * f;
    }
  }
  return k[k.length - 1][1];
}

// a = 0..1 through one hop (0 and 1 = crouched on the ground)
// look = 0..1, how far it has stood up and turned its face to the viewer
function wallabyPose(a, look, twitch) {
  const P = [];
  const add = (ax, ay, bx, by, ra, rb, tint) => P.push([ax, ay, bx, by, ra, rb, tint || 0]);
  const pitch = (key(a, [[0, 40], [0.2, 26], [0.8, 26], [1, 40]]) + 22 * look) * RAD;
  const hx = 0, hy = 0.42;                                   // hip
  const sx = hx + 0.46 * Math.cos(pitch), sy = hy + 0.46 * Math.sin(pitch);   // shoulder
  add(hx, hy, sx, sy, 0.21, 0.135);                         // body
  add(hx - 0.03, hy - 0.02, hx + 0.03, hy + 0.01, 0.24, 0.23);  // haunch

  const na = pitch + (42 - 22 * look) * RAD;                 // neck and head
  const nx = sx + 0.2 * Math.cos(na), ny = sy + 0.2 * Math.sin(na);
  add(sx, sy, nx, ny, 0.115, 0.08, 1);
  // head: in profile the snout points forward; face-on it shortens into a round face
  add(nx, ny, nx + 0.19 * (1 - look), ny - 0.06 - 0.03 * look, 0.085 + 0.012 * look, 0.04 + 0.022 * look);
  // ears: swept back in profile, an upright V when facing the viewer
  add(nx - 0.03 - 0.03 * look, ny + 0.04, nx - 0.15 - 0.01 * look, ny + 0.27 + 0.02 * look, 0.042, 0.022);
  add(nx + 0.01 + 0.05 * look, ny + 0.05, nx + 0.06 + 0.1 * look + 0.05 * twitch, ny + 0.3 - 0.01 * look, 0.042, 0.022);
  add(sx + 0.03, sy - 0.06, sx + 0.13, sy - 0.23, 0.05, 0.03);    // forearm

  const t1 = key(a, [[0, -45], [0.18, -95], [0.5, -60], [0.85, -30], [1, -45]]) * RAD;
  const t2 = key(a, [[0, -135], [0.18, -115], [0.5, -150], [0.85, -115], [1, -135]]) * RAD;
  const t3 = key(a, [[0, 0], [0.18, -80], [0.5, -50], [0.85, -15], [1, 0]]) * RAD;
  const kx = hx + 0.24 * Math.cos(t1), ky = hy + 0.24 * Math.sin(t1);   // knee
  const ax = kx + 0.28 * Math.cos(t2), ay = ky + 0.28 * Math.sin(t2);   // ankle
  add(hx, hy, kx, ky, 0.16, 0.085);                           // thigh
  add(kx, ky, ax, ay, 0.075, 0.05);                          // shin
  add(ax, ay, ax + 0.26 * Math.cos(t3), ay + 0.26 * Math.sin(t3), 0.05, 0.032);  // long foot

  const d1 = (key(a, [[0, 30], [0.25, 10], [0.5, -8], [0.8, 15], [1, 30]]) + 12 * look) * RAD;
  const d2 = key(a, [[0, 4], [0.25, -15], [0.5, -25], [0.8, -5], [1, 4]]) * RAD;
  const bx = hx - 0.13, by = hy - 0.04;                      // tail, in two pieces
  const mx = bx - 0.4 * Math.cos(d1), my = by - 0.4 * Math.sin(d1);
  add(bx, by, mx, my, 0.125, 0.07);
  add(mx, my, mx - 0.42 * Math.cos(d2), my - 0.42 * Math.sin(d2), 0.07, 0.03);
  P.eyes = look > 0.5 ? [[nx - 0.055, ny + 0.012], [nx + 0.055, ny + 0.012]]
                      : [[nx + 0.035, ny + 0.015]];
  P.facing = look > 0.5;
  return P;
}

// which part of the animal (if any) covers this point: 0 none, 1 body, 2 neck, 3 tail tip
function wallabyAt(P, x, y) {
  let hit = 0;
  for (let m = 0; m < P.length; m++) {
    const s = P[m];
    const dx = s[2] - s[0], dy = s[3] - s[1];
    let h = ((x - s[0]) * dx + (y - s[1]) * dy) / (dx * dx + dy * dy);
    h = h < 0 ? 0 : h > 1 ? 1 : h;
    const ex = x - s[0] - dx * h, ey = y - s[1] - dy * h;
    const r = s[4] + (s[5] - s[4]) * h;
    if (ex * ex + ey * ey < r * r) { if (s[6]) return s[6] + 1; hit = 1; }
  }
  return hit;
}

function drawWallaby(t) {
  if (!CONFIG.wallaby || reducedMotion) return;
  if (nextWallaby < 0) nextWallaby = t + 6 + Math.random() * 6;
  if (!wallaby) {
    if (t < nextWallaby) return;
    spawnWallaby(t);
    if (!wallaby) return;
  }
  const S = wallaby.S, dir = wallaby.dir;
  // timeline: hop in, land, pause (settle, turn to look, wait, turn back), hop out
  const te = t - wallaby.t0;
  const tStop = wallaby.stopHop * HOP_TIME;
  const SETTLE = 0.25, TURN = 0.3, BACK = 0.25;
  const hold = CONFIG.wallabyLook ? SETTLE + TURN + CONFIG.wallabyWait + BACK : 0;
  let q, look = 0, twitch = 0;
  if (te < tStop) q = te / HOP_TIME;
  else if (te < tStop + hold) {
    q = wallaby.stopHop;
    const p = te - tStop;
    look = Math.max(0, Math.min(1, (p - SETTLE) / TURN, (hold - p) / BACK));
    look = look * look * (3 - 2 * look);
    const tw = p - SETTLE - TURN - CONFIG.wallabyWait * 0.45;   // one ear flick while it waits
    if (tw > 0 && tw < 0.24) twitch = Math.sin(tw / 0.24 * Math.PI * 2);
  } else q = (te - hold) / HOP_TIME;
  const n = Math.floor(q);
  const a = Math.min(1, (q - n) / 0.78);          // in the air, then a beat on the ground
  const ox = wallaby.x0 + dir * (n + a) * HOP_LENGTH * S;
  if (ox > W + 1.2 * S || ox < -1.2 * S) {
    wallaby = null;
    const e = CONFIG.wallabyEvery;
    nextWallaby = t + e[0] + Math.random() * (e[1] - e[0]);
    return;
  }
  const lift = HOP_HEIGHT * 4 * a * (1 - a);
  const P = wallabyPose(a, look, twitch);
  const C = CONFIG.colors;
  const groundY = groundRow * ch;
  paintShape(P, ox, groundY - lift * S, S, dir,
             Math.floor((ox - 1.1 * S) / cw), Math.ceil((ox + 1.1 * S) / cw),
             Math.floor((groundY - (1.4 + lift) * S) / ch), groundRow - 1,
             [C.wallaby, C.wallabyNeck, C.wallabyDark],
             P.eyes, P.facing ? C.wallabyEye : C.wallabyDark);
}

/* Draw a creature made of tapered segments (P) as text. (ox, oy) is where
   its own origin sits on screen in pixels, S is pixels per unit, dir = 1
   facing right / -1 facing left. Each cell is sampled at six points and
   gets a character that matches how much of it is covered. */
function paintShape(P, ox, oy, S, dir, i0, i1, j0, j1, colors, eyes, eyeColor) {
  i0 = Math.max(0, i0); i1 = Math.min(cols - 1, i1);
  j0 = Math.max(0, j0); j1 = Math.min(rows - 1, j1);
  const ci = Math.round(ox / cw), cj = Math.round(oy / ch);
  const eyeCells = eyes.map(e => [Math.floor((ox + dir * e[0] * S) / cw),
                                  Math.floor((oy - e[1] * S) / ch)]);
  for (let j = j0; j <= j1; j++) {
    for (let i = i0; i <= i1; i++) {
      let bits = 0, cnt = 0, part = 0;
      for (let b = 0; b < 6; b++) {
        const px = (i + (b & 1 ? 0.75 : 0.25)) * cw;
        const py = (j + ((b >> 1) * 2 + 1) / 6) * ch;
        const hit = wallabyAt(P, dir * (px - ox) / S, (oy - py) / S);
        if (hit) { bits |= 1 << b; cnt++; if (hit > part) part = hit; }
      }
      if (!cnt) continue;
      const top = (bits & 1) + (bits >> 1 & 1), mid = (bits >> 2 & 1) + (bits >> 3 & 1);
      const bot = (bits >> 4 & 1) + (bits >> 5 & 1);
      const lft = (bits & 1) + (bits >> 2 & 1) + (bits >> 4 & 1);
      let c;
      if (cnt >= 3) c = FUR[Math.floor(hash3(i - ci, j - cj, 30) * FUR.length)];
      else if (top === 0 && mid === 0) c = bot === 2 ? '_' : lft ? '.' : ',';
      else if (bot === 0 && mid === 0) c = top === 2 ? '"' : lft ? '`' : "'";
      else if (top === 0 && bot === 0) c = '-';
      else if (top === 0) c = lft ? '.' : ',';
      else if (bot === 0) c = lft ? '`' : "'";
      else c = ':';
      let color = colors[part - 1];
      for (let e = 0; e < eyeCells.length; e++) {
        if (i === eyeCells[e][0] && j === eyeCells[e][1] && cnt >= 3) { c = 'o'; color = eyeColor; }
      }
      ctx.fillStyle = CONFIG.colors.bg;
      ctx.fillRect(i * cw, j * ch, cw + 0.5, ch);
      ctx.fillStyle = color;
      ctx.fillText(c, i * cw, j * ch);
    }
  }
}

/* ------------------------------------------------------------------
   Cockatoos. A pair of white, yellow-crested cockatoos crosses the sky
   now and then, one a little behind and above the other, flapping with
   the odd short glide. Units: 1 = the bird's length, beak to tail.
------------------------------------------------------------------ */
let flock = null, nextFlock = -1;

function cockatooPose(ph, glide) {
  const P = [];
  const add = (ax, ay, bx, by, ra, rb, tint) => P.push([ax, ay, bx, by, ra, rb, tint || 0]);
  const th = glide ? 0.2 : 1.15 * Math.sin(ph);            // inner wing angle
  const th2 = glide ? 0.3 : 1.25 * Math.sin(ph - 0.7);     // the outer wing follows a beat behind
  const bob = glide ? 0 : -0.04 * Math.sin(ph);            // body rises as the wings push down
  add(-0.3, bob, 0.24, 0.03 + bob, 0.115, 0.105);          // body
  add(-0.3, bob, -0.62, -0.03 + bob, 0.085, 0.06);         // tail
  add(0.33, 0.06 + bob, 0.4, 0.07 + bob, 0.1, 0.095);      // head
  add(0.36, 0.15 + bob, 0.2, 0.26 + bob, 0.042, 0.018, 1); // yellow crest, swept back
  add(0.48, 0.04 + bob, 0.52, -0.03 + bob, 0.04, 0.025, 2);  // dark beak
  const sx = 0.06, sy = 0.05 + bob;                        // shoulder
  const mx = sx - 0.1, my = sy + 0.38 * Math.sin(th);
  add(sx, sy, mx, my, 0.15, 0.13);                         // wing, in two pieces
  add(mx, my, mx - 0.12 - 0.06 * Math.abs(Math.sin(th2)), my + 0.36 * Math.sin(th2), 0.13, 0.05);
  P.eyes = [[0.4, 0.09 + bob]];
  return P;
}

function drawCockatoos(t) {
  if (!CONFIG.cockatoos || reducedMotion) return;
  if (nextFlock < 0) nextFlock = t + 10 + Math.random() * 8;
  if (!flock) {
    if (t < nextFlock || !cols) return;
    const dir = Math.random() < 0.5 ? 1 : -1;
    flock = {
      t0: t, dir: dir, S: ch * 8 * CONFIG.cockatooSize,
      y0: H * (0.12 + 0.26 * Math.random()),
      climb: (Math.random() - 0.5) * 0.12,                 // drifting slightly up or down
      speed: Math.max(150, W / 7)                          // pixels per second
    };
  }
  const C = CONFIG.colors, F = flock, S = F.S;
  const gone = (W + 6 * S) / F.speed;
  if (t - F.t0 > gone) {
    flock = null;
    const e = CONFIG.cockatooEvery;
    nextFlock = t + e[0] + Math.random() * (e[1] - e[0]);
    return;
  }
  for (let k = 0; k < 2; k++) {
    const lead = (F.dir > 0 ? -S : W + S) + F.dir * F.speed * (t - F.t0);
    const ox = lead - F.dir * k * 2.1 * S;
    const oy = F.y0 - k * 0.7 * S + (ox - W / 2) * F.climb * F.dir
             + Math.sin(t * 0.9 + k * 2.3) * 0.22 * S;
    const glide = noise3(t * 0.55, k * 9.1, 7.7) > 0.66;
    const P = cockatooPose(t * 15 + k * 1.9, glide);
    paintShape(P, ox, oy, S, F.dir,
               Math.floor((ox - 0.85 * S) / cw), Math.ceil((ox + 0.85 * S) / cw),
               Math.floor((oy - 1.0 * S) / ch), Math.ceil((oy + 1.0 * S) / ch),
               [C.cockatoo, C.cockatooCrest, C.cockatooBeak], P.eyes, C.cockatooBeak);
  }
}

/* Boulders and a fallen log on the forest floor. Positions are fractions
   of the width, chosen to sit in the gaps between the trees. */
function buildGround() {
  objects = [];
  colO = new Int16Array(cols).fill(-1);
  if (!CONFIG.groundDetail) return;
  const put = o => {
    for (let i = Math.max(0, Math.floor(o.x - o.rx)); i <= Math.min(cols - 1, Math.ceil(o.x + o.rx)); i++) {
      if (colO[i] < 0) colO[i] = objects.length;
    }
    objects.push(o);
  };
  put({ rock: true, x: cols * 0.065, rx: 7, ry: 3.2 });
  put({ rock: true, x: cols * 0.065 + 10, rx: 3.5, ry: 1.7 });
  put({ rock: true, x: cols * 0.815, rx: 5.5, ry: 2.5 });
  put({ rock: false, x: cols * 0.515, rx: Math.min(13, cols * 0.07), ry: 2 });
}

function objectAt(i, up) {
  const id = colO[i];
  if (id < 0) return false;
  const o = objects[id], C = CONFIG.colors;
  const dx = i - o.x;
  if (o.rock) {
    const inside = (x, y) => x * x / (o.rx * o.rx) + y * y / (o.ry * o.ry) <= 1;
    if (!inside(dx, up - 0.5)) return false;
    const top = !inside(dx, up + 0.5);
    const edgeL = !inside(dx - 1, up - 0.5), edgeR = !inside(dx + 1, up - 0.5);
    const h = hash3(i, up, 70 + id);
    if (top && !edgeL && !edgeR) { oC = h < 0.8 ? '_' : '.'; oColor = C.rock[2]; }
    else if (edgeL) { oC = top ? '.' : '('; oColor = C.rock[2]; }
    else if (edgeR) { oC = top ? '.' : ')'; oColor = C.rock[0]; }
    else if (h < 0.05) { oC = 'o'; oColor = C.lichen; }                 // lichen
    else if (h < 0.4) { oC = h < 0.2 ? '.' : h < 0.3 ? ':' : ','; oColor = C.rock[dx < 0 ? 1 : 0]; }
    else oC = ' ';
    return true;
  }
  // the log: a lit top edge, a bark-textured side, and a cut end showing
  if (up > 2 || Math.abs(dx) > o.rx) return false;
  const h = hash3(i, up, 80);
  const end = dx < -o.rx + 3;
  if (up === 2) {
    if (end || dx > o.rx - 1) return false;
    oC = h < 0.06 ? '/' : '_'; oColor = C.log[1];
  } else if (end) {
    oC = '(@)'[Math.round(dx + o.rx)] || '('; oColor = C.log[2];
  } else if (dx > o.rx - 1) { oC = ')'; oColor = C.log[0]; }
  else { oC = h < 0.45 ? '=' : h < 0.75 ? '-' : h < 0.9 ? '~' : ':'; oColor = C.log[h < 0.3 ? 1 : 0]; }
  return true;
}

/* Tussocks: each is a fan of long strap leaves rising from one point,
   stiff and fairly upright, with the outer leaves shorter. */
function buildTussocks() {
  tussocks = [];
  colT = new Int16Array(cols * 3).fill(-1);
  if (!CONFIG.understory) return;
  let x = Math.floor(hash3(0, 1, 60) * 6), n = 0;
  while (x < cols) {
    n++;
    // smaller close to a trunk, so the trees stay readable
    let near = 1;
    for (const T of trees) near = Math.min(near, 0.35 + Math.abs(x - T.x) / (14 * T.size));
    const r = hash3(n, 2, 60);
    const h = (2.6 + 4.6 * r * Math.sqrt(r)) * near * CONFIG.understory;
    if (h >= 2 && colO[Math.min(cols - 1, x)] < 0) {       // not on top of a boulder or the log
      const K = { x: x, h: h, w: h * (0.7 + 0.5 * hash3(n, 3, 60)), flower: hash3(n, 4, 60) < 0.3 };
      const reach = Math.ceil(K.w) + 5;
      for (let i = Math.max(0, x - reach); i <= Math.min(cols - 1, x + reach); i++) {
        for (let s = 0; s < 3; s++) if (colT[i * 3 + s] < 0) { colT[i * 3 + s] = tussocks.length; break; }
      }
      tussocks.push(K);
    }
    // loose clumps of two or three, then a gap
    x += hash3(n, 5, 60) < 0.35 ? 3 + Math.floor(hash3(n, 6, 60) * 3) : 7 + Math.floor(hash3(n, 7, 60) * 15);
  }
}

function tussockAt(i, up, t) {
  for (let s = 0; s < 3; s++) {
    const id = colT[i * 3 + s];
    if (id < 0) break;
    const K = tussocks[id];
    if (up > K.h) continue;
    const f = up / K.h;                               // 0 at the base, 1 at the leaf tips
    // leaves flex in the wind, the tips most of all
    const dx = i - K.x - (wind * 0.9 + Math.sin(t * 1.3 + K.x) * 0.25 * wind) * f * f * K.h * 0.22;
    const spread = 0.6 + K.w * Math.pow(f, 0.75);     // the fan opens out as it rises
    const a = Math.abs(dx) / spread;
    if (a > 1) continue;
    const e = Math.abs(dx) / K.w;
    const top = 1 - 0.4 * e * e;                      // outer leaves are shorter
    if (f > top) continue;
    const hx = Math.round(dx) + K.x * 3;
    if (hash3(hx, up, 8) > 0.97 - 0.42 * a - 0.12 * f) continue;    // ragged, more so outwards
    const slope = dx / up;
    sC = slope < -0.4 ? '\\' : slope > 0.4 ? '/' : '|';
    if (f > top - 1.1 / K.h && e > 0.5) sC = dx < 0 ? '`' : "'";    // thin leaf tips
    const C = CONFIG.colors;
    // dead straw-coloured leaves, mostly low down in the tussock
    if (hash3(hx, up, 9) < 0.1 + 0.28 * (1 - f)) sColor = C.straw[hash3(hx, up, 10) < 0.5 ? 0 : 1];
    else sColor = C.shrub[Math.max(0, Math.min(2, Math.floor(f * 1.5 + hash3(hx, up, 11) * 1.5 - (dx > 0 ? 0.4 : 0))))];
    // an old flower spike or two standing among the leaves
    if (K.flower && Math.abs(dx - 1) < 0.6 && f > 0.5 && f < 0.92) {
      sC = hash3(hx, up, 12) < 0.55 ? '*' : '!'; sColor = C.straw[1];
    }
    return true;
  }
  return false;
}

/* What, if anything, of a background tree is in this cell?
   0 = nothing, 1 = trunk, 2 = shaded crown, 3 = lit crown */
function midAt(i, up, t, wind) {
  for (let m = 0; m < midTrees.length; m++) {
    const T = midTrees[m];
    const far = i - T.x;
    if (far > T.rx + 8 || far < -T.rx - 8) continue;
    const f = up / T.h;
    const dx = far - T.lean * up - wind * 1.6 * f * f;
    const ey = (up - T.h) / T.ry;
    if (ey > -1.3 && ey < 1) {
      const ex = dx / T.rx;
      const r = ex * ex + ey * ey;
      if (r < 1) {
        const nn = noise3(dx * 0.33 + T.k * 13, up * 0.5, t * 0.18 + T.k);
        if (nn > 0.36 + r * 0.26) return nn > 0.6 ? 3 : 2;
      }
    }
    if (up < T.h && Math.abs(dx) < (T.wide && f < 0.5 ? 1 : 0.5)) return 1;
  }
  return 0;
}

/* ------------------------------------------------------------------
   Wind
------------------------------------------------------------------ */
let wind = 0.3;         // current wind, roughly -2..2 (positive = to the right)
let windPhase = 0;      // accumulated wind, used to drift the air streaks
let pointer = 0, pointerTarget = 0;
let lastT = 0;

if (CONFIG.pointerWind) {
  window.addEventListener('pointermove', e => {
    pointerTarget = (e.clientX / (W || 1) - 0.5) * 3;
  });
  document.addEventListener('pointerleave', () => { pointerTarget = 0; });
}
canvas.addEventListener('click', () => spawnWallaby(lastT));

/* ------------------------------------------------------------------
   One frame. Like the ASCII playground, every cell of the grid asks
   "what am I?" and answers with one character and one colour.
------------------------------------------------------------------ */
function draw(t) {
  const C = CONFIG.colors;
  const dt = Math.max(0, Math.min(0.1, t - lastT));
  lastT = t;

  // slow gusts + quicker flutter + the mouse
  pointer += (pointerTarget - pointer) * 0.04;
  const gust = noise3(t * 0.13, 3.1, 0.5) * 2 - 1;
  const flutter = noise3(t * 0.7, 9.7, 0.5) * 2 - 1;
  let target = (0.3 + 0.9 * gust + 0.25 * flutter) * CONFIG.wind + pointer;
  target = Math.max(-2.2, Math.min(2.2, target));
  wind += (target - wind) * 0.06;
  windPhase += wind * dt * 0.5;

  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  let lastColor = '';

  for (let j = 0; j < rows; j++) {
    const up = groundRow - j;                    // rows above the ground

    for (let i = 0; i < cols; i++) {
      let c = ' ', color = C.air;

      if (up > 0) {
        // ground cover at this column: grass height, and any tussock
        const gh = hash3(i, 1, 6) < 0.6
          ? Math.floor(noise3(i * 0.35, 2.2, 0) * 3.3) : 0;
        const tus = tussockAt(i, up, t);
        const obj = !tus && up <= 4 && objectAt(i, up);

        // the Callitris trees, nearest first
        let hit = false, d = -1;
        for (let k = 0; k < trees.length; k++) {
          const T = trees[k];
          const found = treeAt(T, i, j, t);
          if (tD > d) d = tD;
          if (found) {
            // the foot of a tree further back is hidden by the grass and tussocks in front
            hit = !(T.baseRows && (up <= gh || tus || obj));
            break;
          }
        }

        if (hit) {
          c = tC; color = tColor;
        } else {
          /* ---------- tussocks, background trees, grass, air ---------- */
          {
            let mid = 0;
            if (tus) {
              c = sC; color = sColor;
            } else if (obj && !(up === 1 && gh > 0 && hash3(i, 3, 6) < 0.45)) {
              c = oC; color = oColor;                 // a little grass grows in front
            } else if (up > gh && d < 0 && (mid = midAt(i, up, t, wind))) {
              if (mid === 1) {
                c = hash3(i, up >> 1, 10) < 0.8 ? '|' : ':';
                color = C.midTrunk;
              } else {
                c = CROWN_CH[Math.floor(hash3(i, j, 11) * CROWN_CH.length)];
                color = C.midCrown[mid - 2];
              }
            } else if (up <= gh) {
              const lw = wind +
                (noise3(i * 0.15 - windPhase * 2, 0.5, t * 0.4) - 0.5) * 1.6;
              c = lw > 0.45 ? '/' : lw < -0.45 ? '\\' : '|';
              if (up === gh && hash3(i, 2, 6) < 0.4) c = lw > 0 ? ',' : "'";
              color = C.grass;
            } else {
              // faint streaks of moving air
              const a = noise3(i * 0.05 - windPhase, j * 0.8, t * 0.07);
              if (a > 0.8) { c = a > 0.87 ? '~' : '-'; color = C.air; }
              else if (hash3(i, j, 7) < 0.004) { c = '.'; color = C.air; }

              // distant canopy: densest at its skyline, thinning into mist below
              if (c === ' ' && d < -0.15 && up <= farH[i]) {
                const f = up / farH[i];
                const drift = noise3(i * 0.08 + t * 0.03, j * 0.35, t * 0.05);
                if (hash3(i, j, 12) < (0.1 + 0.5 * f * f) * (0.45 + drift)) {
                  c = FAR_CH[Math.floor(hash3(i, j, 13) * FAR_CH.length)];
                  color = C.far[f > 0.72 ? 1 : 0];
                }
              }

              // a distant hill behind the canopy, and a few stars above it
              if (c === ' ' && d < -0.15) {
                const rh = Math.max(ridgeH[i], farH[i]);
                if (up <= ridgeH[i] && up > farH[i] * 0.7) {
                  const crest = up > ridgeH[i] - 1;
                  const hr = hash3(i, j, 15);
                  if (hr < (crest ? 0.8 : 0.09)) {
                    c = crest ? (hr < 0.3 ? '.' : hr < 0.55 ? ',' : hr < 0.7 ? ':' : "'") : '.';
                    color = C.ridge[crest ? 1 : 0];
                  }
                } else if (CONFIG.stars && up > rh) {
                  const hs = hash3(i, j, 16);
                  if (hs < 0.011) {
                    const tw = noise3(i * 7.3, j * 3.1, t * 0.6 + hs * 900);   // twinkle
                    if (tw > 0.3) {
                      c = hs < 0.0012 ? '*' : hs < 0.004 ? '+' : '.';
                      color = C.star[tw > 0.62 ? 2 : tw > 0.45 ? 1 : 0];
                    }
                  }
                }
              }
            }
          }
        }
      } else if (j === groundRow) {
        c = SURFACE[Math.floor(hash3(i, 0, 5) * SURFACE.length)];
        color = C.ground;
      } else {
        const depth = j - groundRow;
        const h = hash3(i, j, 5);
        if (h < 0.22 / depth) { c = h < 0.07 / depth ? ',' : '.'; color = C.ground; }
      }

      if (c !== ' ') {
        if (color !== lastColor) { ctx.fillStyle = color; lastColor = color; }
        ctx.fillText(c, i * cw, j * ch);
      }
    }
  }

  drawCockatoos(t);
  drawWallaby(t);

  if (CONFIG.caption && rows > 4) {
    ctx.fillStyle = C.caption;
    const row = rows - 1;
    for (let k = 0; k < CONFIG.caption.length; k++) {
      ctx.fillText(CONFIG.caption[k], (2 + k) * cw, row * ch);
    }
  }
}

/* ------------------------------------------------------------------
   Run
------------------------------------------------------------------ */
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(resize).observe(canvas);
} else {
  window.addEventListener('resize', resize);
}
resize();

if (!reducedMotion) {
  const frameMs = 1000 / CONFIG.fps;
  let lastFrame = 0;
  const loop = now => {
    requestAnimationFrame(loop);
    if (now - lastFrame < frameMs - 1) return;
    lastFrame = now;
    draw(now / 1000);
  };
  requestAnimationFrame(loop);
}
})();
</script>

<script>
/* ------------------------------------------------------------------
   Page behaviour, separate from the scene: the name settling out of
   foliage characters on load, and the slide-in panels.
------------------------------------------------------------------ */
(() => {
'use strict';
const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const nameEl = document.getElementById('name');
const NAME = nameEl.textContent;
const GLYPHS = '\\/|;:!il%&*';
if (!still) {
  nameEl.setAttribute('aria-label', NAME);
  const t0 = performance.now();
  const tick = now => {
    const done = (now - t0 - 500) / 55;          // letters settled so far
    let out = '';
    for (let k = 0; k < NAME.length; k++) {
      out += k < done || NAME[k] === ' ' ? NAME[k]
           : GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
    }
    nameEl.textContent = out;
    if (done < NAME.length) setTimeout(() => requestAnimationFrame(tick), 45);
  };
  requestAnimationFrame(tick);
}

// panels are opened by #links, so the back button and shared links work
const panels = Array.from(document.querySelectorAll('.panel'));
const links = Array.from(document.querySelectorAll('nav a'));
function show() {
  const id = location.hash.slice(1);
  panels.forEach(p => p.classList.toggle('open', p.id === id));
  links.forEach(a => {
    if (a.getAttribute('href') === '#' + id) a.setAttribute('aria-current', 'true');
    else a.removeAttribute('aria-current');
  });
}
function closePanel() {
  history.pushState('', document.title, location.pathname + location.search);
  show();
}
window.addEventListener('hashchange', show);
links.forEach(a => a.addEventListener('click', e => {
  if (a.getAttribute('aria-current')) { e.preventDefault(); closePanel(); }   // click again to close
}));
panels.forEach(p => p.querySelector('.close').addEventListener('click', closePanel));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && location.hash) closePanel(); });
document.getElementById('tree').addEventListener('click', () => { if (location.hash) closePanel(); });
show();
})();
</script>

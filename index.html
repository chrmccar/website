<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Christopher McCarthy</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{

    height:100%;

}

body{

    overflow-x:hidden;

    /* tall enough that the page can be "moved" (scrolled) */
    min-height:220vh;

    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;

    background:#0a0a0a;

}

/* ---------- BLURRED BACKGROUND ---------- */

.background{

    position:fixed;
    inset:0;

    background-image:url("01-024.jpg");
    background-size:cover;
    background-position:center;

    transform:scale(1.15);

    filter:
        blur(28px)
        brightness(.22)
        contrast(120%)
        saturate(0);

}

/* dark overlay */

.background::after{

    content:"";

    position:absolute;
    inset:0;

    background:rgba(0,0,0,.5);

}

/* ---------- PAGE ---------- */

main{

    position:relative;

    z-index:2;

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

}

/* ---------- IMAGE ---------- */

.hero{

    position:relative;

    width:min(760px,88vw);

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);

}

.hero img{

    display:block;
    width:100%;
    height:auto;

}

.hero img.disintegrating{
    visibility:hidden;
}

.hero canvas{

    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

}

/* text sits ABOVE the shard canvas so it stays legible */
.hero .plate{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
}

/* ---------- NAME ---------- */

.name{

    position:absolute;

    left:38px;
    bottom:36px;

    color:#ece8df;

    font-family:Georgia,serif;

    font-size:clamp(2rem,4vw,3.6rem);

    line-height:.9;

    letter-spacing:-.04em;

    text-shadow:
        0 3px 25px rgba(0,0,0,.85);

    mix-blend-mode:difference;

}

/* ---------- CONCERN LINE (on the image) ---------- */

.concern{

    position:absolute;

    left:40px;

    bottom:128px;

    max-width:60%;

    color:#ece8df;

    font-family:Georgia,serif;
    font-style:italic;

    font-size:clamp(1rem,1.9vw,1.35rem);

    line-height:1.3;

    text-shadow:
        0 2px 20px rgba(0,0,0,.9);

    pointer-events:auto;

}

.concern a{

    color:#ece8df;

    text-decoration:none;

    border-bottom:1px solid rgba(236,232,223,.55);

    transition:.25s;

}

.concern a:hover{

    opacity:.6;

    letter-spacing:.05em;

}

/* ---------- INDEX ---------- */

.index{

    position:absolute;

    top:34px;
    left:38px;

    z-index:4;

    border:none;
    background:none;

    color:#ece8df;

    font-size:12px;

    letter-spacing:.35em;

    text-transform:uppercase;

    cursor:pointer;

    transition:.25s;

}

.index::after{

    content:"";

    display:block;

    width:58px;
    height:1px;

    background:#ece8df;

    margin-top:9px;

    transition:.25s;

}

.index:hover{

    opacity:.65;

}

.index:hover::after{

    width:80px;

}

/* ---------- OVERLAY ---------- */

.overlay{

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.35);

    opacity:0;

    pointer-events:none;

    transition:.35s;

    z-index:8;

}

/* ---------- MENU ---------- */

nav{

    position:fixed;

    top:0;
    left:0;

    width:430px;
    max-width:85vw;

    height:100vh;

    background:#141414;

    padding:120px 70px;

    transform:translateX(-100%);

    transition:.45s cubic-bezier(.2,.8,.2,1);

    z-index:10;

}

nav a{

    display:block;

    color:#ece8df;

    text-decoration:none;

    font-family:Georgia,serif;

    font-size:46px;

    margin-bottom:22px;

    transition:.25s;

}

nav a:hover{

    opacity:.45;

}

body.open-time .nav-time,
body.open-plants .nav-plants{

    transform:translateX(0);

}

body.open-time .overlay,
body.open-plants .overlay{

    opacity:1;
    pointer-events:auto;

}

</style>

</head>

<body>

<div class="background"></div>

<div class="overlay" onclick="closeMenu()"></div>

<nav class="nav-time">

<a href="/time/">Time</a>

</nav>

<nav class="nav-plants">

<a href="/plants/">Plants</a>

</nav>

<main>

<div class="hero">

<img src="01-024.jpg" id="hero-img" crossorigin="anonymous">

<canvas id="shatter"></canvas>

<div class="plate">

    <div class="concern">
        I am concerned about what is happening to <a href="#" onclick="openMenu('time');return false;">time</a>.<br>
        I am concerned about <a href="#" onclick="openMenu('plants');return false;">plants</a>.
    </div>

    <div class="name">
        Christopher<br>
        McCarthy
    </div>

</div>

</div>

</main>

<script>

function openMenu(which){

    document.body.classList.remove("open-time","open-plants");
    document.body.classList.add("open-" + which);

}

function closeMenu(){

    document.body.classList.remove("open-time","open-plants");

}

/* ---------- DISINTEGRATION ---------- */

(function(){

    const img    = document.getElementById("hero-img");
    const canvas = document.getElementById("shatter");
    const ctx    = canvas.getContext("2d");

    const COLS = 26;
    const ROWS = 18;

    let cells = [];
    let ready = false;

    function build(){

        const w = img.naturalWidth;
        const h = img.naturalHeight;
        if(!w || !h) return;

        canvas.width  = w;
        canvas.height = h;

        const cw = w / COLS;
        const ch = h / ROWS;

        cells = [];

        for(let r=0; r<ROWS; r++){
            for(let c=0; c<COLS; c++){

                cells.push({
                    sx:c*cw, sy:r*ch, w:cw, h:ch,
                    dx:(Math.random()-.5),
                    dy:(Math.random()*.6+.4),
                    rot:(Math.random()-.5),
                    jitter:Math.random()*Math.PI*2
                });

            }
        }

        img.classList.add("disintegrating");
        ready = true;
        draw(0);
    }

    function draw(progress){

        if(!ready) return;

        ctx.clearRect(0,0,canvas.width,canvas.height);

        const p = Math.min(Math.max(progress,0),1);
        const spread = p * Math.max(canvas.width,canvas.height) * 0.9;

        for(const cell of cells){

            const wob = Math.sin(cell.jitter + p*10) * 6 * p;

            const ox = cell.dx * spread + wob;
            const oy = cell.dy * spread;

            ctx.save();
            ctx.globalAlpha = 1 - p*0.9;
            ctx.translate(cell.sx + cell.w/2 + ox,
                          cell.sy + cell.h/2 + oy);
            ctx.rotate(cell.rot * p * 1.2);
            ctx.drawImage(
                img,
                cell.sx, cell.sy, cell.w, cell.h,
                -cell.w/2, -cell.h/2, cell.w, cell.h
            );
            ctx.restore();
        }
    }

    function onMove(){
        const max = document.documentElement.scrollHeight - window.innerHeight;
        const progress = max > 0 ? window.scrollY / max : 0;
        draw(progress);
    }

    if(img.complete && img.naturalWidth){
        build();
    } else {
        img.addEventListener("load", build);
    }

    window.addEventListener("scroll", onMove, {passive:true});
    window.addEventListener("resize", onMove);

})();

</script>

</body>

</html>

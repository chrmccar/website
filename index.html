<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christopher McCarthy</title>
<style>
  :root {
    --bg: #0b1014;
    --text: #dbe4d6;      /* name, headings */
    --soft: #a3b3a7;      /* body text, links */
    --dim: #6f8078;       /* close button */
    --accent: #ecd24a;    /* the cockatoo's crest */
    --mono: "JetBrains Mono", "Fira Code", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: var(--mono); color: var(--soft); }

  /* the animated scene fills the whole window, behind everything */
  #tree { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }

  /* ---- name (top left) and menu (top right), sitting in the sky ---- */
  .masthead {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
    gap: 10px 28px; padding: 22px 28px;
    pointer-events: none;                 /* clicks fall through to the scene... */
    text-shadow: 0 0 6px var(--bg), 0 0 14px var(--bg);
  }
  .masthead a { pointer-events: auto; }   /* ...except on the links */
  .masthead h1 {
    margin: 0; font-size: 19px; font-weight: 500; letter-spacing: 0.16em;
    color: var(--text); white-space: nowrap;
  }
  nav { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; letter-spacing: 0.08em; }
  nav a { color: var(--soft); text-decoration: none; padding: 4px 0; }
  nav a::before { content: "["; opacity: 0; margin-right: 3px; color: var(--accent); }
  nav a::after  { content: "]"; opacity: 0; margin-left: 3px;  color: var(--accent); }
  nav a:hover, nav a:focus-visible, nav a[aria-current="true"] { color: var(--text); outline: none; }
  nav a:hover::before, nav a:hover::after,
  nav a:focus-visible::before, nav a:focus-visible::after,
  nav a[aria-current="true"]::before, nav a[aria-current="true"]::after { opacity: 1; }

  /* ---- content panels: slide in over the right of the scene ---- */
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 2;
    box-sizing: border-box; padding: 96px 30px 30px; overflow-y: auto;
    background: rgba(11, 16, 20, 0.88); border-left: 1px solid #1f2b2e;
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    transform: translateX(100%); visibility: hidden;
    transition: transform 0.35s ease, visibility 0s linear 0.35s;
    font-size: 13.5px; line-height: 1.75;
  }
  .panel.open { transform: none; visibility: visible; transition: transform 0.35s ease; }
  .panel h2 { margin: 0 0 18px; font-size: 14px; font-weight: 500; letter-spacing: 0.16em; color: var(--text); }
  .panel h2::before { content: "/ "; color: var(--accent); }
  .panel p { margin: 0 0 16px; }
  .panel a { color: var(--text); }
  .panel .close {
    position: absolute; top: 90px; right: 26px; background: none; border: 0; cursor: pointer;
    font: inherit; font-size: 13px; letter-spacing: 0.08em; color: var(--dim); padding: 4px;
  }
  .panel .close:hover, .panel .close:focus-visible { color: var(--text); outline: none; }

  @media (max-width: 640px) {
    .masthead { padding: 16px 18px; }
    .masthead h1 { font-size: 16px; letter-spacing: 0.12em; }
    .panel { padding: 110px 22px 24px; border-left: 0; background: rgba(11, 16, 20, 0.93); }
    .panel .close { top: 104px; right: 18px; }
  }
  @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>
</head>
<body>
<canvas id="tree" role="img"
  aria-label="Animated text art of a dry forest: Callitris rhomboidea trees swaying in the wind, with a wallaby and cockatoos passing through"></canvas>

<!-- ================= NAME AND MENU ================= -->
<header class="masthead">
  <h1 id="name">Christopher McCarthy</h1>
  <nav aria-label="Sections">
    <a href="#about">about</a>
    <a href="#contact">contact</a>
  </nav>
</header>

<!-- ================= CONTENT PANELS =================
     Each <section> opens when its menu link is clicked. Replace the
     text in [square brackets] with your own. To add a section later,
     copy one, give it a new id, and add a matching link in the menu. -->
<section class="panel" id="about" aria-labelledby="about-h">
  <button class="close" type="button">close &times;</button>
  <h2 id="about-h">about</h2>
  <p>[Your text here.]</p>
</section>

<section class="panel" id="contact" aria-labelledby="contact-h">
  <button class="close" type="button">close &times;</button>
  <h2 id="contact-h">contact</h2>
  <p>[Your contact details here.]</p>
</section>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------
   SETTINGS: the things you are most likely to want to change
------------------------------------------------------------------ */
const CONFIG = {
  fontSize: 11,             // px. Smaller = more characters = a bigger, finer tree
                            // next to the wallaby (which is a fixed number of rows tall)
  fontFamily: '"JetBrains Mono", "Fira Code", Menlo, Consolas, "DejaVu Sans Mono", monospace',
  fps: 30,
  seed: 11,                 // change for a different individual tree
  wind: 1.0,                // 0 = still air, 2 = blustery
  pointerWind: true,        // moving the mouse left/right pushes the wind
  caption: '',              // text shown bottom-left, e.g. 'Callitris rhomboidea' ('' = none)
  // The Callitris trees, nearest first. For each one:
  //   x         where it stands across the view (0 = left edge, 1 = right edge)
  //   size      height compared with the main tree
  //   distance  0 = close, 1 = far away at the top of the slope (smaller, fainter, higher up)
  //   base      how far up the trunk the foliage starts (fraction of height)
  //   width     how broad the crown is
  //   shoulders small = sides nearly parallel (columnar), large = widest low down (conical)
  //   taper     small = blunt top, large = long drawn-out point
  //   nod       which way the leading shoot leans: 1 right, -1 left
  //   health    1 = healthy (the default), 0.5 = sickly and thinning, 0 = dead and bare
  trees: [
    { x: 0.435, size: 1.00, distance: 0.00, base: 0.08, width: 0.22, shoulders: 0.30, taper: 0.65, nod:  1 },
    { x: 0.735, size: 0.72, distance: 0.45, base: 0.18, width: 0.17, shoulders: 0.20, taper: 0.50, nod: -1 },
    { x: 0.135, size: 0.50, distance: 0.85, base: 0.05, width: 0.30, shoulders: 0.48, taper: 0.95, nod:  1 },
    { x: 0.91, size: 0.60, distance: 0.65, base: 0.12, width: 0.20, shoulders: 0.36, taper: 0.85, nod: -1 },
    { x: 0.60, size: 0.38, distance: 1.00, base: 0.10, width: 0.27, shoulders: 0.26, taper: 0.55, nod:  1 },
    // drought-killed: mostly bare grey branches with patches of browned foliage
    { x: 0.262, size: 0.64, distance: 0.30, base: 0.10, width: 0.20, shoulders: 0.30, taper: 0.70, nod: -1, health: 0.15 }
  ],
  // Understory plants. x = position across the view, z = depth
  // (0 = level with the main tree, 1 = top of the slope).
  // Grass trees (Xanthorrhoea minor). spikes = how many flower stalks (0-3);
  // flowering: true gives cream spikes in bloom instead of old brown ones.
  grassTrees: [
    { x: 0.34,  z: -0.05, size: 1.0,  spikes: 3, flowering: false },
    { x: 0.668, z: 0.12,  size: 1.05, spikes: 2, flowering: true },
    { x: 0.2,   z: 0.42,  size: 1.0,  spikes: 1, flowering: false }
  ],
  insects: true,            // a few insects hovering round the flowering spikes
  treeFern:  null,                                // Cyathea australis: switched off (e.g. { x: 0.81, z: 0.2, size: 1.25 })
  mist: 1.0,                // haze drifting between the slope and the far hill (0 = none)
  falling: 1.0,             // foliage and the odd cone shaken loose in gusts (0 = none)
  echidna: true,            // an echidna wanders across the foreground now and then
  echidnaEvery: [45, 100],  // seconds between visits: shortest, longest
  hill: 1.0,                // how strongly the ground slopes (0 = level ground)
  hillRises: 'left',        // which side the hill climbs towards: 'left' or 'right'
  rockyHill: true,          // a second, more distant rocky hill with Callitris silhouettes along its skyline
  rockyHillSide: 'right',   // 'left' or 'right'
  rockyHillSize: 1.0,       // how high it stands
  ridge: true,              // a distant hill line behind the forest
  stars: true,              // a few faint stars in the open sky
  groundDetail: true,       // boulders and a fallen log on the forest floor
  forest: true,             // false = just the single tree, as before
  forestTrees: 1.0,         // how many dim background trees (0 = none, 2 = lots)
  understory: 1.0,          // size of the grassy tussocks along the ground (0 = none)
  wallaby: true,            // a wallaby hops through now and then (click to call one)
  wallabyEvery: [20, 50],   // seconds between visits: shortest, longest
  cockatoos: true,          // a pair of white cockatoos flies over now and then
  cockatooEvery: [25, 60],  // seconds between fly-overs: shortest, longest
  cockatooSize: 1.0,
  cockatooPerch: 0.33,      // share of visits where they land on the main tree and look around
  cockatooLook: 1.0,        // seconds they spend looking around before flying off
  wallabySize: 1.0,         // 1 = about nine rows of text tall
  wallabyLook: true,        // stops part-way across and looks out at the viewer
  wallabyWait: 1.0,         // seconds it holds the look before hopping on
  colors: {
    // forest layers, kept deliberately dim so the Callitris stays the subject
    ridge: ['#121f26', '#27404a'],              // distant hill: slope, crest
    star: ['#3d4c5c', '#7f90a3', '#c9d3de'],    // dim -> bright
    rock: ['#3c4548', '#566064', '#8c979a'],    // shaded -> lit
    lichen: '#9aa68a',
    log: ['#5d5044', '#93816c', '#b39b7c'],     // bark, lit bark, cut end
    farHill: ['#1b2930', '#35454d', '#62757d'],   // distant rocky hill: scree, rock, lit skyline
    farCallitris: ['#1f3a31', '#2c4c40'],         // Callitris silhouettes on its skyline: shaded, lit
    farScrub: '#213a31',                          // tiny far-off shrubs on it
    grassTree: ['#4a6652', '#66876a', '#88a784'],   // fine grey-green leaves, shaded -> lit
    grassTreeStalk: '#8c8e63',
    grassTreeSpike: ['#6f5238', '#8e6d48', '#e3d9b0'],   // old flower spike: dark, brown, cream flecks
    grassTreeFlower: ['#c9bd8c', '#efe8c6', '#fffbe6'],  // spike in bloom
    insect: '#f0dc8a',
    fernTrunk: ['#3b2f27', '#524238', '#6a5746'],
    fernFrond: ['#2f6a3a', '#4a9150', '#7cbf6e'],   // underside, frond, lit
    mist: ['#22313a', '#31434d'],
    echidna: '#5a4838',
    echidnaSpine: '#cdb888',
    echidnaDark: '#2c2521',
    crest: '#526a5c',                           // the edge of the hill against the forest behind
    far: ['#1a2c34', '#243b40'],                // distant misty canopy
    midTrunk: '#39403f',                        // background trunks
    midCrown: ['#1c342f', '#28473b'],           // background crowns
    shrub: ['#414f2e', '#5c6b39', '#7d8a49'],   // tussock leaves: tough olive green, shaded -> lit
    straw: ['#7a6c46', '#a39160'],              // dead leaves and old flower spikes
    bg: '#0b1014',
    // foliage, shaded side -> sunlit side
    foliage: ['#1f3f38', '#2a5344', '#376a50', '#4a8360', '#6c9f7a', '#96bd98'],
    barkLight: '#9a8b78',
    barkDark: '#65584c',
    cone: '#c0905f',
    // browned, drought-killed foliage, shaded -> lit
    deadFoliage: ['#3b2d24', '#574030', '#755438', '#91663f', '#ab7b4a', '#c2955f'],
    deadWood: '#8b8a84',
    wallaby: '#a3978a',       // grey-brown coat
    wallabyNeck: '#b3805f',   // reddish neck and shoulders
    wallabyDark: '#3a332e',   // eye, in profile
    cockatoo: '#f0ece2',
    cockatooCrest: '#ecd24a',
    cockatooBeak: '#5f5c5a',
    wallabyEye: '#f1e8d2',    // eyes, when it looks at you
    grass: '#7d8f55',
    ground: '#6b6a4a',
    air: '#243240',
    caption: '#56636f'
  }
};

/* ------------------------------------------------------------------
   Noise helpers
------------------------------------------------------------------ */
const SEED = CONFIG.seed | 0;

function hash3(x, y, z) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^
          Math.imul(z, 1440662683) ^ Math.imul(SEED, 974634777);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const w = zf * zf * (3 - 2 * zf);
  const a = hash3(xi, yi, zi),         b = hash3(xi + 1, yi, zi);
  const c = hash3(xi, yi + 1, zi),     d = hash3(xi + 1, yi + 1, zi);
  const e = hash3(xi, yi, zi + 1),     f = hash3(xi + 1, yi, zi + 1);
  const g = hash3(xi, yi + 1, zi + 1), h = hash3(xi + 1, yi + 1, zi + 1);
  const x1 = a + (b - a) * u, x2 = c + (d - c) * u;
  const x3 = e + (f - e) * u, x4 = g + (h - g) * u;
  const y1 = x1 + (x2 - x1) * v, y2 = x3 + (x4 - x3) * v;
  return y1 + (y2 - y1) * w;
}

/* ------------------------------------------------------------------
   Character sets. Callitris foliage is fine and thread-like on
   ascending branches, so the glyphs are thin and the outer sprays
   slant upward and outward: \ on the left of the trunk, / on the right.
------------------------------------------------------------------ */
// outermost branchlets droop at the tips, so the slant flips at the edge
const EDGE_L  = ['/', ',', ';', '.', '/', ',', ':'];
const EDGE_R  = ['\\', ',', ';', '.', '\\', ',', ':'];
const MID_L   = ['\\', ';', '!', ':', 'i', '\\', 'l', ';'];
const MID_R   = ['/', ';', '!', ':', 'i', '/', 'l', ';'];
const DENSE   = ['i', 'l', '!', '|', 't', ';', '%', '&', '*', 'f'];
const BARK    = ['|', '|', '|', '!', '|', ':', 'I', '|'];
const SURFACE = ['_', '_', '_', '_', '.', '_', ',', '-', '_', ' '];

/* ------------------------------------------------------------------
   Canvas / grid set-up
------------------------------------------------------------------ */
const canvas = document.getElementById('tree');
const ctx = canvas.getContext('2d');
const reducedMotion = window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let cols = 0, rows = 0, cw = 8, ch = 16;   // grid size and cell size (px)
let groundRow = 0, treeH = 40, cx = 0, aspect = 0.5;
let W = 0, H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  if (!W || !H) return;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // shrink the font on small screens so the tree keeps enough rows
  const fs = Math.max(8, Math.min(CONFIG.fontSize, Math.floor(H / 42)));
  ctx.font = fs + 'px ' + CONFIG.fontFamily;
  ctx.textBaseline = 'top';
  cw = ctx.measureText('M').width;
  ch = Math.round(fs * 1.25);
  cols = Math.ceil(W / cw);
  rows = Math.floor(H / ch);
  aspect = cw / ch;

  groundRow = rows - 1;
  buildTerrain();
  // main tree height in rows: as tall as fits every tree where it stands on the slope
  treeH = Math.floor(cols * 0.8 * aspect / 0.22);
  for (const t of CONFIG.trees) {
    treeH = Math.min(treeH, (groundRow - groundUp(cols * t.x, t.distance) - (CONFIG.cockatoos ? 5 : 2)) / t.size);
  }
  treeH = Math.max(12, Math.floor(treeH));
  cx = Math.floor(cols / 2);
  buildTrees();
  buildForest();
  if (reducedMotion) draw(0);
}

/* ------------------------------------------------------------------
   The ground. Instead of a flat line, the forest floor is a sloping
   surface seen at an angle. Two lines define it, each stored as "rows
   above the bottom of the screen" for every column:
     frontUp - where depth 0 sits (the main tree and the wallaby)
     crestUp - the top edge of the slope, where it meets the forest behind
   Anything with a depth z (0 near .. 1 far) stands on the surface at
   groundUp(x, z). Below frontUp is foreground, closer than the main tree.
------------------------------------------------------------------ */
let frontUp = new Float32Array(0), crestUp = new Float32Array(0);
let groundPal = [], grassPal = [];
const DEPTH_BINS = 5;
const LITTER_NEAR = [',', '.', '`', "'", '-', '~', ':', ';', '_', '.'];
const LITTER_FAR = ['.', '.', ':', '-', '.', '_'];

function buildTerrain() {
  frontUp = new Float32Array(cols);
  crestUp = new Float32Array(cols);
  const hill = CONFIG.hill;
  for (let i = 0; i < cols; i++) {
    let x = i / Math.max(1, cols - 1);
    if (CONFIG.hillRises === 'right') x = 1 - x;
    const h = 0.5 + 0.5 * Math.cos(Math.PI * x);          // 1 on the high side .. 0 on the low side
    const wob = (noise3(i * 0.03, 21.7, 0) - 0.5) * hill;  // gentle unevenness
    frontUp[i] = 2.5 + rows * 0.085 * hill * h + wob * 1.2;
    crestUp[i] = frontUp[i] + rows * (0.13 + 0.14 * hill * h) + wob * 2;
  }
  groundPal = []; grassPal = [];
  for (let b = 0; b < DEPTH_BINS; b++) {
    const f = b / (DEPTH_BINS - 1);
    groundPal.push(fade(CONFIG.colors.ground, f * 0.55));
    grassPal.push(fade(CONFIG.colors.grass, f * 0.6));
  }
}
function groundUp(x, z) {
  const i = Math.max(0, Math.min(cols - 1, Math.round(x)));
  return frontUp[i] + (crestUp[i] - frontUp[i]) * z;
}

/* ------------------------------------------------------------------
   The Callitris trees
------------------------------------------------------------------ */
let trees = [];
let tC = ' ', tColor = '', tD = -1;     // what treeAt() found in the last cell it looked at

function fade(hex, f) {                 // blend a colour towards the background
  const a = parseInt(hex.slice(1), 16), b = parseInt(CONFIG.colors.bg.slice(1), 16);
  const m = sh => Math.round((a >> sh & 255) + ((b >> sh & 255) - (a >> sh & 255)) * f);
  return 'rgb(' + m(16) + ',' + m(8) + ',' + m(0) + ')';
}

function buildTrees() {
  const C = CONFIG.colors;
  trees = CONFIG.trees.map((t, k) => {
    const h = Math.max(8, treeH * t.size);
    const f = t.distance * 0.42;
    return {
      k: k, x: Math.round(cols * t.x), h: h, size: t.size, distance: t.distance,
      baseRows: Math.round(groundUp(cols * t.x, t.distance)),
      base: t.base, width: t.width, shoulders: t.shoulders, taper: t.taper, nod: t.nod,
      reach: Math.ceil((t.width * 1.05 + 0.13) * h / aspect),
      health: t.health === undefined ? 1 : t.health,
      fol: C.foliage.map(c => fade(c, f)),
      dead: C.deadFoliage.map(c => fade(c, f)), wood: fade(C.deadWood, f),
      barkLight: fade(C.barkLight, f), barkDark: fade(C.barkDark, f), cone: fade(C.cone, f)
    };
  });
  trees.sort((a, b) => a.distance - b.distance);      // nearest first, so it is drawn in front
}

/* Is part of tree T in this cell? If so, sets tC / tColor and returns true.
   Always sets tD: how deep inside that tree's crown outline the cell is. */
function treeAt(T, i, j, t) {
  tD = -1;
  const di = i - T.x;
  if (di > T.reach || di < -T.reach) return false;
  const tj = groundRow - T.baseRows - j;
  const v = tj / T.h;                               // 0 at the ground, 1 at the tip
  if (v <= 0 || v > 1.02) return false;
  const unit = aspect / T.h;                        // one column, in tree-height units

  // the tree bends more the higher you go, with a little whip at the top
  const bend = wind * 0.045 * v * v + Math.sin(t * 1.9 + v * 5 + T.k * 2.1) * 0.004 * v * wind;
  // the leading shoot nods over at the very top
  const tip = Math.max(0, (v - 0.86) / 0.14);
  const nod = T.nod * 0.024 * tip * tip * (1 + 0.5 * wind * T.nod);
  // crown half-width at this height
  const s = (v - T.base) / (1 - T.base);
  const cw_ = (s > 0 && s < 1) ? T.width * Math.pow(s, T.shoulders) * Math.pow(1 - s, T.taper) : 0;

  const u = di * unit - bend - nod;                 // sideways distance from the trunk
  const au = Math.abs(u);
  const left = u < 0;
  // "home" cell in the tree's own frame, so details travel with the sway
  const ti = Math.round(u / unit), z = T.k * 37;

  let D = -1, d = -1, n = 0.5;
  if (cw_ > 1e-4) {
    d = 1 - au / cw_;                               // 1 on the axis, 0 at the crown edge
    if (d > -0.7) {
      // clumps stretched along ascending branches (constant q)
      const q = v - au * 1.4;
      n = 0.62 * noise3(q * 30 + z, au * 14 + (left ? 0 : 17.3), t * 0.22) +
          0.38 * noise3(u * 70 + 9, v * 45 + z, t * 0.5);
      D = d * 1.15 + (n - 0.5) * 1.05;
    }
  }
  tD = d;

  const sick = 1 - T.health;
  // an unhealthy tree has lost foliage, most of all from the outside in
  if (D > 0.07 + sick * (0.5 + 0.25 * (1 - d))) {
    /* ---------- foliage ---------- */
    const shimmer = noise3(i * 0.7, j * 0.7, t * 0.8);
    const pick = (hash3(ti, tj, 1 + z) + shimmer) % 1;
    const k = D + (shimmer - 0.5) * 0.3;
    const set = k < 0.32 ? (left ? EDGE_L : EDGE_R)
              : k < 0.7  ? (left ? MID_L : MID_R)
              : DENSE;
    tC = set[Math.floor(pick * set.length)];
    // light from the upper left; outer sprays a little paler
    let light = 0.48 - (u / cw_) * 0.3 + (v - 0.5) * 0.15 + (n - 0.5) * 0.9;
    light = Math.max(0, Math.min(0.999, light));
    // what foliage is left on a sick tree is mostly browned off
    const alive = sick === 0 || hash3(ti >> 1, tj >> 1, 5 + z) < T.health * 0.8;
    tColor = (alive ? T.fol : T.dead)[Math.floor(light * T.fol.length)];
    // seed cones, clustered on the older wood inside the crown
    if (D > 0.3 + sick * 0.3 && d > 0.1 && d < 0.8 &&
        noise3(ti * 0.13 + z, tj * 0.13, 40) > 0.6 && hash3(ti, tj, 2 + z) < 0.09) {
      tC = 'o';
      tColor = T.cone;
    }
    return true;
  }
  const tw = Math.max(unit * 0.5, 0.011 * (1 - 0.8 * v) + 0.012 * Math.exp(-v * 28));
  if (v < 0.97 && au < tw) {
    tC = BARK[Math.floor(hash3(ti, tj >> 1, 3 + z) * BARK.length)];
    tColor = left ? T.barkLight : T.barkDark;
    return true;
  }
  if (d > 0.3 - sick * 0.28 && hash3(ti, tj, 4 + z) < 0.45 + sick * 0.2 * d) {
    tC = left ? '\\' : '/';                         // branch glimpsed through a gap
    tColor = sick > 0.4 ? T.wood : T.barkDark;      // bleached grey on a dead tree
    return true;
  }
  return false;
}

/* ------------------------------------------------------------------
   Forest backdrop: three quiet layers behind and beside the main tree
     far   - a distant canopy line dissolving into mist
     mid   - a few dim, open-crowned trees standing further back
     shrub - strappy tussocks along the ground (loosely Lomandra longifolia
             as it grows in dry forest: upright, ragged, part straw-coloured)
------------------------------------------------------------------ */
const FAR_CH   = ['.', ':', '.', "'", ',', '.'];
const CROWN_CH = ['.', ':', ';', "'", '"', ',', ':'];
let farH = [], ridgeH = [], midTrees = [];
let hill2H = new Float32Array(0), farRocks = [];
let rC = ' ', rColor = '';              // what farRockAt() found
let colO = new Int16Array(0), objects = [];
let plantGs = [], plantF = null, fernPts = [], fernT = -1;
let pC = ' ', pColor = '', pZ = 0;      // what plantAt() found
let oC = ' ', oColor = '', oZ = 0;      // what objectAt() found, and how far away it is
let tussocks = [], colT = new Int16Array(0);
let sC = ' ', sColor = '', sZ = 0;      // what tussockAt() found, and how far away it is
const SLOTS = 5;                        // tussocks that can overlap one column

function buildForest() {
  farH = new Float32Array(cols);
  ridgeH = new Float32Array(cols);
  midTrees = [];
  if (CONFIG.ridge) for (let i = 0; i < cols; i++) {
    ridgeH[i] = treeH * (0.5 + 0.2 * noise3(i * 0.012, 11.3, 0) + 0.05 * noise3(i * 0.07, 12.1, 0));
  }
  buildRockyHill();
  buildGround();
  buildPlants();
  if (!CONFIG.forest) return;

  for (let i = 0; i < cols; i++) {
    // skyline: long rolling shape plus small bumps for individual treetops
    const bump = noise3(i * 0.55, 8.3, 0);
    farH[i] = treeH * (0.28 + 0.22 * noise3(i * 0.035, 7.1, 0)) + 3 * bump * bump;

  }
  buildTussocks();

  // background trees: one per slot across the width, none behind the main crown
  const n = Math.round(cols / 24 * CONFIG.forestTrees);
  for (let k = 0; k < n; k++) {
    const x = (k + 0.2 + 0.6 * hash3(k, 1, 20)) * cols / n;
    if (trees.some(T => Math.abs(x - T.x) < T.width * 0.6 * T.h / aspect + 12)) continue;
    midTrees.push({
      x: x,
      h: treeH * (0.5 + 0.42 * hash3(k, 2, 20)),   // rows from ground to crown centre
      rx: 6 + 6 * hash3(k, 3, 20),                 // crown radii, in columns / rows
      ry: 3.5 + 3.5 * hash3(k, 4, 20),
      lean: (hash3(k, 5, 20) - 0.5) * 0.12,
      wide: hash3(k, 6, 20) < 0.35,
      k: k
    });
  }
}

/* ------------------------------------------------------------------
   Wallaby. Built as a little skeleton of tapered "sausages" (body,
   haunch, hind leg, tail, neck, head, ears, forearm). Each text cell
   checks how much of itself the animal covers and picks a character
   to match, so the silhouette animates smoothly as the pose changes.
   Units: 1 = roughly the animal's standing height.
------------------------------------------------------------------ */
const RAD = Math.PI / 180;
const HOP_TIME = 0.62;      // seconds per hop
const HOP_LENGTH = 1.9;     // body-heights travelled per hop
const HOP_HEIGHT = 0.42;    // body-heights off the ground
const FUR = ['%', '&', '#', '%', '&', '%', '#', '&'];

let wallaby = null, nextWallaby = -1;

function spawnWallaby(t) {
  if (wallaby || !cols || !CONFIG.wallaby) return;
  const dir = Math.random() < 0.5 ? 1 : -1;
  const S = ch * 8.5 * CONFIG.wallabySize;          // pixels per body-height
  const x0 = dir > 0 ? -S : W + S;
  // pick a spot somewhere across the middle of the view to stop and look
  let target = W * (0.22 + 0.56 * Math.random());
  // ...but not right in front of the tree
  for (const T of trees) {
    const tx = T.x * cw, gap = W * 0.11 * T.size;
    if (Math.abs(target - tx) < gap) target = tx + (target < tx ? -gap : gap);
  }
  const stopHop = Math.max(1, Math.round(Math.abs(target - x0) / (HOP_LENGTH * S)));
  wallaby = { t0: t, dir: dir, S: S, x0: x0, stopHop: stopHop };
}

// value at "a" along a list of [position, value] keyframes
function key(a, k) {
  for (let i = 1; i < k.length; i++) {
    if (a <= k[i][0]) {
      const f = (a - k[i - 1][0]) / (k[i][0] - k[i - 1][0]);
      return k[i - 1][1] + (k[i][1] - k[i - 1][1]) * f;
    }
  }
  return k[k.length - 1][1];
}

// a = 0..1 through one hop (0 and 1 = crouched on the ground)
// look = 0..1, how far it has stood up and turned its face to the viewer
function wallabyPose(a, look, twitch) {
  const P = [];
  const add = (ax, ay, bx, by, ra, rb, tint) => P.push([ax, ay, bx, by, ra, rb, tint || 0]);
  const pitch = (key(a, [[0, 40], [0.2, 26], [0.8, 26], [1, 40]]) + 22 * look) * RAD;
  const hx = 0, hy = 0.42;                                   // hip
  const sx = hx + 0.46 * Math.cos(pitch), sy = hy + 0.46 * Math.sin(pitch);   // shoulder
  add(hx, hy, sx, sy, 0.21, 0.135);                         // body
  add(hx - 0.03, hy - 0.02, hx + 0.03, hy + 0.01, 0.24, 0.23);  // haunch

  const na = pitch + (42 - 22 * look) * RAD;                 // neck and head
  const nx = sx + 0.2 * Math.cos(na), ny = sy + 0.2 * Math.sin(na);
  add(sx, sy, nx, ny, 0.115, 0.08, 1);
  // head: in profile the snout points forward; face-on it shortens into a round face
  add(nx, ny, nx + 0.19 * (1 - look), ny - 0.06 - 0.03 * look, 0.085 + 0.012 * look, 0.04 + 0.022 * look);
  // ears: swept back in profile, an upright V when facing the viewer
  add(nx - 0.03 - 0.03 * look, ny + 0.04, nx - 0.15 - 0.01 * look, ny + 0.27 + 0.02 * look, 0.042, 0.022);
  add(nx + 0.01 + 0.05 * look, ny + 0.05, nx + 0.06 + 0.1 * look + 0.05 * twitch, ny + 0.3 - 0.01 * look, 0.042, 0.022);
  add(sx + 0.03, sy - 0.06, sx + 0.13, sy - 0.23, 0.05, 0.03);    // forearm

  const t1 = key(a, [[0, -45], [0.18, -95], [0.5, -60], [0.85, -30], [1, -45]]) * RAD;
  const t2 = key(a, [[0, -135], [0.18, -115], [0.5, -150], [0.85, -115], [1, -135]]) * RAD;
  const t3 = key(a, [[0, 0], [0.18, -80], [0.5, -50], [0.85, -15], [1, 0]]) * RAD;
  const kx = hx + 0.24 * Math.cos(t1), ky = hy + 0.24 * Math.sin(t1);   // knee
  const ax = kx + 0.28 * Math.cos(t2), ay = ky + 0.28 * Math.sin(t2);   // ankle
  add(hx, hy, kx, ky, 0.16, 0.085);                           // thigh
  add(kx, ky, ax, ay, 0.075, 0.05);                          // shin
  add(ax, ay, ax + 0.26 * Math.cos(t3), ay + 0.26 * Math.sin(t3), 0.05, 0.032);  // long foot

  const d1 = (key(a, [[0, 30], [0.25, 10], [0.5, -8], [0.8, 15], [1, 30]]) + 12 * look) * RAD;
  const d2 = key(a, [[0, 4], [0.25, -15], [0.5, -25], [0.8, -5], [1, 4]]) * RAD;
  const bx = hx - 0.13, by = hy - 0.04;                      // tail, in two pieces
  const mx = bx - 0.4 * Math.cos(d1), my = by - 0.4 * Math.sin(d1);
  add(bx, by, mx, my, 0.125, 0.07);
  add(mx, my, mx - 0.42 * Math.cos(d2), my - 0.42 * Math.sin(d2), 0.07, 0.03);
  P.eyes = look > 0.5 ? [[nx - 0.055, ny + 0.012], [nx + 0.055, ny + 0.012]]
                      : [[nx + 0.035, ny + 0.015]];
  P.facing = look > 0.5;
  return P;
}

// which part of the animal (if any) covers this point: 0 none, 1 body, 2 neck, 3 tail tip
function wallabyAt(P, x, y) {
  let hit = 0;
  for (let m = 0; m < P.length; m++) {
    const s = P[m];
    const dx = s[2] - s[0], dy = s[3] - s[1];
    let h = ((x - s[0]) * dx + (y - s[1]) * dy) / (dx * dx + dy * dy);
    h = h < 0 ? 0 : h > 1 ? 1 : h;
    const ex = x - s[0] - dx * h, ey = y - s[1] - dy * h;
    const r = s[4] + (s[5] - s[4]) * h;
    if (ex * ex + ey * ey < r * r) { if (s[6]) return s[6] + 1; hit = 1; }
  }
  return hit;
}

function drawWallaby(t) {
  if (!CONFIG.wallaby || reducedMotion) return;
  if (nextWallaby < 0) nextWallaby = t + 6 + Math.random() * 6;
  if (!wallaby) {
    if (t < nextWallaby) return;
    spawnWallaby(t);
    if (!wallaby) return;
  }
  const S = wallaby.S, dir = wallaby.dir;
  // timeline: hop in, land, pause (settle, turn to look, wait, turn back), hop out
  const te = t - wallaby.t0;
  const tStop = wallaby.stopHop * HOP_TIME;
  const SETTLE = 0.25, TURN = 0.3, BACK = 0.25;
  const hold = CONFIG.wallabyLook ? SETTLE + TURN + CONFIG.wallabyWait + BACK : 0;
  let q, look = 0, twitch = 0;
  if (te < tStop) q = te / HOP_TIME;
  else if (te < tStop + hold) {
    q = wallaby.stopHop;
    const p = te - tStop;
    look = Math.max(0, Math.min(1, (p - SETTLE) / TURN, (hold - p) / BACK));
    look = look * look * (3 - 2 * look);
    const tw = p - SETTLE - TURN - CONFIG.wallabyWait * 0.45;   // one ear flick while it waits
    if (tw > 0 && tw < 0.24) twitch = Math.sin(tw / 0.24 * Math.PI * 2);
  } else q = (te - hold) / HOP_TIME;
  const n = Math.floor(q);
  const a = Math.min(1, (q - n) / 0.78);          // in the air, then a beat on the ground
  const ox = wallaby.x0 + dir * (n + a) * HOP_LENGTH * S;
  if (ox > W + 1.2 * S || ox < -1.2 * S) {
    wallaby = null;
    const e = CONFIG.wallabyEvery;
    nextWallaby = t + e[0] + Math.random() * (e[1] - e[0]);
    return;
  }
  const lift = HOP_HEIGHT * 4 * a * (1 - a);
  const P = wallabyPose(a, look, twitch);
  const C = CONFIG.colors;
  // stand on the slope at depth 0, wherever along it the wallaby is
  const gc = Math.max(0, Math.min(cols - 1.001, ox / cw)), g0 = Math.floor(gc);
  const front = frontUp[g0] + (frontUp[g0 + 1] - frontUp[g0]) * (gc - g0);
  const groundY = (groundRow - front) * ch;
  paintShape(P, ox, groundY - lift * S, S, dir,
             Math.floor((ox - 1.1 * S) / cw), Math.ceil((ox + 1.1 * S) / cw),
             Math.floor((groundY - (1.4 + lift) * S) / ch), rows - 1,
             [C.wallaby, C.wallabyNeck, C.wallabyDark],
             P.eyes, P.facing ? C.wallabyEye : C.wallabyDark);
}

/* Draw a creature made of tapered segments (P) as text. (ox, oy) is where
   its own origin sits on screen in pixels, S is pixels per unit, dir = 1
   facing right / -1 facing left. Each cell is sampled at six points and
   gets a character that matches how much of it is covered. */
function paintShape(P, ox, oy, S, dir, i0, i1, j0, j1, colors, eyes, eyeColor) {
  i0 = Math.max(0, i0); i1 = Math.min(cols - 1, i1);
  j0 = Math.max(0, j0); j1 = Math.min(rows - 1, j1);
  const ci = Math.round(ox / cw), cj = Math.round(oy / ch);
  const eyeCells = eyes.map(e => [Math.floor((ox + dir * e[0] * S) / cw),
                                  Math.floor((oy - e[1] * S) / ch)]);
  for (let j = j0; j <= j1; j++) {
    for (let i = i0; i <= i1; i++) {
      let bits = 0, cnt = 0, part = 0;
      for (let b = 0; b < 6; b++) {
        const px = (i + (b & 1 ? 0.75 : 0.25)) * cw;
        const py = (j + ((b >> 1) * 2 + 1) / 6) * ch;
        const hit = wallabyAt(P, dir * (px - ox) / S, (oy - py) / S);
        if (hit) { bits |= 1 << b; cnt++; if (hit > part) part = hit; }
      }
      if (!cnt) continue;
      const top = (bits & 1) + (bits >> 1 & 1), mid = (bits >> 2 & 1) + (bits >> 3 & 1);
      const bot = (bits >> 4 & 1) + (bits >> 5 & 1);
      const lft = (bits & 1) + (bits >> 2 & 1) + (bits >> 4 & 1);
      let c;
      if (cnt >= 3) c = FUR[Math.floor(hash3(i - ci, j - cj, 30) * FUR.length)];
      else if (top === 0 && mid === 0) c = bot === 2 ? '_' : lft ? '.' : ',';
      else if (bot === 0 && mid === 0) c = top === 2 ? '"' : lft ? '`' : "'";
      else if (top === 0 && bot === 0) c = '-';
      else if (top === 0) c = lft ? '.' : ',';
      else if (bot === 0) c = lft ? '`' : "'";
      else c = ':';
      let color = colors[part - 1];
      for (let e = 0; e < eyeCells.length; e++) {
        if (i === eyeCells[e][0] && j === eyeCells[e][1] && cnt >= 3) { c = 'o'; color = eyeColor; }
      }
      ctx.fillStyle = CONFIG.colors.bg;
      ctx.fillRect(i * cw, j * ch, cw + 0.5, ch);
      ctx.fillStyle = color;
      ctx.fillText(c, i * cw, j * ch);
    }
  }
}

/* ------------------------------------------------------------------
   Cockatoos. A pair of white, yellow-crested cockatoos crosses the sky
   now and then, one a little behind and above the other, flapping with
   the odd short glide. Units: 1 = the bird's length, beak to tail.
------------------------------------------------------------------ */
let flock = null, nextFlock = -1;

function cockatooPose(ph, glide) {
  const P = [];
  const add = (ax, ay, bx, by, ra, rb, tint) => P.push([ax, ay, bx, by, ra, rb, tint || 0]);
  const th = glide ? 0.2 : 1.15 * Math.sin(ph);            // inner wing angle
  const th2 = glide ? 0.3 : 1.25 * Math.sin(ph - 0.7);     // the outer wing follows a beat behind
  const bob = glide ? 0 : -0.04 * Math.sin(ph);            // body rises as the wings push down
  add(-0.3, bob, 0.24, 0.03 + bob, 0.115, 0.105);          // body
  add(-0.3, bob, -0.62, -0.03 + bob, 0.085, 0.06);         // tail
  add(0.33, 0.06 + bob, 0.4, 0.07 + bob, 0.1, 0.095);      // head
  add(0.36, 0.15 + bob, 0.2, 0.26 + bob, 0.042, 0.018, 1); // yellow crest, swept back
  add(0.48, 0.04 + bob, 0.52, -0.03 + bob, 0.04, 0.025, 2);  // dark beak
  const sx = 0.06, sy = 0.05 + bob;                        // shoulder
  const mx = sx - 0.1, my = sy + 0.38 * Math.sin(th);
  add(sx, sy, mx, my, 0.15, 0.13);                         // wing, in two pieces
  add(mx, my, mx - 0.12 - 0.06 * Math.abs(Math.sin(th2)), my + 0.36 * Math.sin(th2), 0.13, 0.05);
  P.eyes = [[0.4, 0.09 + bob]];
  return P;
}

// Perched: upright on its feet (the origin), wings folded, crest up.
// head = 1 facing the way the body faces .. -1 looking back over its shoulder
function cockatooPerched(head) {
  const P = [];
  const add = (ax, ay, bx, by, ra, rb, tint) => P.push([ax, ay, bx, by, ra, rb, tint || 0]);
  add(0, 0.14, 0.03, 0.5, 0.125, 0.115);                       // body, upright
  add(-0.01, 0.14, -0.1, -0.2, 0.075, 0.05);                   // tail hanging down behind
  add(0.03, 0.64, 0.03 + 0.03 * head, 0.65, 0.105, 0.1);       // head
  add(0.03 - 0.02 * head, 0.74, 0.03 - 0.15 * head, 0.93, 0.045, 0.018, 1);   // crest raised
  add(0.03 + 0.11 * head, 0.63, 0.03 + 0.14 * head, 0.56, 0.04, 0.025, 2);    // beak
  P.eyes = [[0.03 + 0.05 * head, 0.67]];
  return P;
}

// Where a bird can sit on a tree: a point on its swaying trunk line at height v
// (0 ground .. 1 tip), pushed sideways by "side" crown-widths. Returns pixels.
function perchPoint(T, v, side, t) {
  const bend = wind * 0.045 * v * v + Math.sin(t * 1.9 + v * 5 + T.k * 2.1) * 0.004 * v * wind;
  const tip = Math.max(0, (v - 0.86) / 0.14);
  const nod = T.nod * 0.024 * tip * tip * (1 + 0.5 * wind * T.nod);
  const s = (v - T.base) / (1 - T.base);
  const half = T.width * Math.pow(s, T.shoulders) * Math.pow(1 - s, T.taper);
  const col = T.x + 0.5 + (bend + nod + side * half) * T.h / aspect;
  return [col * cw, (groundRow - T.baseRows - v * T.h) * ch];
}

function drawCockatoos(t) {
  if (!CONFIG.cockatoos || reducedMotion) return;
  if (nextFlock < 0) nextFlock = t + 10 + Math.random() * 8;
  if (!flock) {
    if (t < nextFlock || !cols) return;
    const perch = Math.random() < CONFIG.cockatooPerch && trees.length > 0;
    const dir = Math.random() < 0.5 ? 1 : -1;
    flock = {
      t0: t, dir: dir, S: ch * 8 * CONFIG.cockatooSize, perch: perch,
      y0: H * (0.12 + 0.26 * Math.random()),
      climb: (Math.random() - 0.5) * 0.12,                 // drifting slightly up or down
      speed: Math.max(150, W / 7)                          // pixels per second
    };
  }
  const C = CONFIG.colors, F = flock, S = F.S, dir = F.dir;
  const colors = [C.cockatoo, C.cockatooCrest, C.cockatooBeak];
  const el = t - F.t0;
  const done = () => {
    flock = null;
    const e = CONFIG.cockatooEvery;
    nextFlock = t + e[0] + Math.random() * (e[1] - e[0]);
  };
  const fly = (k, ox, oy, glide) => {
    const P = cockatooPose(t * 15 + k * 1.9, glide);
    paintShape(P, ox, oy, S, dir,
               Math.floor((ox - 0.85 * S) / cw), Math.ceil((ox + 0.85 * S) / cw),
               Math.floor((oy - 1.0 * S) / ch), Math.ceil((oy + 1.0 * S) / ch),
               colors, P.eyes, C.cockatooBeak);
  };

  if (!F.perch) {
    /* ----- flying straight over ----- */
    if (el > (W + 6 * S) / F.speed) { done(); return; }
    for (let k = 0; k < 2; k++) {
      const lead = (dir > 0 ? -S : W + S) + dir * F.speed * el;
      const ox = lead - dir * k * 2.1 * S;
      const oy = F.y0 - k * 0.7 * S + (ox - W / 2) * F.climb * dir
               + Math.sin(t * 0.9 + k * 2.3) * 0.22 * S;
      fly(k, ox, oy, noise3(t * 0.55, k * 9.1, 7.7) > 0.66);
    }
    return;
  }

  /* ----- landing on the main tree: fly in, settle, look around, fly off ----- */
  const T = trees[0];
  const SETTLE = 0.35, TURN = 0.3;
  const hold = SETTLE + TURN + CONFIG.cockatooLook + TURN + 0.3;
  let allGone = true;
  for (let k = 0; k < 2; k++) {
    // the first bird takes the top of the tree, the second a branch below it
    const p = k === 0 ? perchPoint(T, 0.93, 0, t) : perchPoint(T, 0.76, -dir * 0.75, t);
    const sx = dir > 0 ? -S : W + S, sy = p[1] + H * 0.14 + k * 0.4 * S;
    const tIn = Math.abs(p[0] - sx) / F.speed * 1.35 + k * 0.5;
    const tSit = hold + k * 0.3;
    if (el < tIn) {
      // gliding in, slowing as it reaches the branch
      const q = el / tIn, e = 1 - (1 - q) * (1 - q);
      const ox = sx + (p[0] - sx) * e;
      const oy = sy + (p[1] - sy) * e - Math.sin(Math.PI * q) * 0.05 * H - 0.3 * S * q * q;
      fly(k, ox, oy, q > 0.82 && q < 0.93);
      allGone = false;
    } else if (el < tIn + tSit) {
      const u = el - tIn;
      // head: forward, then round to look behind, then forward again
      let head = 1;
      if (u > SETTLE) head = 1 - 2 * Math.min(1, (u - SETTLE) / TURN, Math.max(0, (tSit - 0.3 - u) / TURN));
      const P = cockatooPerched(head);
      paintShape(P, p[0], p[1], S, dir,
                 Math.floor((p[0] - 0.5 * S) / cw), Math.ceil((p[0] + 0.5 * S) / cw),
                 Math.floor((p[1] - 1.05 * S) / ch), Math.ceil((p[1] + 0.35 * S) / ch),
                 colors, P.eyes, C.cockatooBeak);
      allGone = false;
    } else {
      // away again, picking up speed
      const u = el - tIn - tSit;
      const ox = p[0] + dir * F.speed * u * u / (u + 0.7);
      const oy = p[1] - 0.35 * S + H * 0.1 * Math.min(1, u / 1.5) + Math.sin(t * 0.9 + k * 2.3) * 0.15 * S;
      if (ox > -1.5 * S && ox < W + 1.5 * S) { fly(k, ox, oy, false); allGone = false; }
    }
  }
  if (allGone) done();
}

/* ------------------------------------------------------------------
   Bits of foliage, and the odd cone, shaken out of the trees in gusts.
------------------------------------------------------------------ */
let bits = [];
function drawFalling(t, dt) {
  if (!CONFIG.falling || reducedMotion || !trees.length) return;
  // the harder it blows, the more comes loose
  const gusty = Math.max(0, Math.abs(wind) - 0.75);
  if (bits.length < 40 && Math.random() < gusty * dt * 14 * CONFIG.falling) {
    const T = trees[Math.floor(Math.random() * Math.random() * trees.length)];   // mostly the nearer trees
    const p = perchPoint(T, T.base + 0.12 + Math.random() * (0.8 - T.base), Math.random() * 1.6 - 0.8, t);
    const cone = Math.random() < 0.08 && T.health > 0.5;
    const pal = T.health > 0.5 ? T.fol : T.dead;
    bits.push({
      x: p[0], y: p[1], vx: 0, ph: Math.random() * 6, cone: cone,
      floor: (groundRow - T.baseRows) * ch,                 // where that tree meets the ground
      c: cone ? 'o' : ["'", ',', '`', ';', '.', ':'][Math.floor(Math.random() * 6)],
      color: cone ? T.cone : pal[3 + Math.floor(Math.random() * 3)]
    });
  }
  for (let n = bits.length - 1; n >= 0; n--) {
    const b = bits[n];
    b.vx += ((b.cone ? 12 : 55) * wind - b.vx) * Math.min(1, dt * 2.5);     // carried along by the wind
    b.x += b.vx * dt;
    b.y += (b.cone ? 150 : 34 + 16 * Math.sin(t * 5 + b.ph)) * dt;          // foliage flutters, cones drop
    if (b.y > b.floor || b.x < -cw || b.x > W + cw) { bits.splice(n, 1); continue; }
    const i = Math.floor(b.x / cw), j = Math.floor(b.y / ch);
    ctx.fillStyle = CONFIG.colors.bg;
    ctx.fillRect(i * cw, j * ch, cw, ch);
    ctx.fillStyle = b.color;
    ctx.fillText(b.c, i * cw, j * ch);
  }
}

/* ------------------------------------------------------------------
   Echidna. Wanders slowly across the foreground, nearer than the
   wallaby, stopping now and then to nose at the ground.
   Units: 1 = its length.
------------------------------------------------------------------ */
let echidna = null, nextEchidna = -1;

function echidnaPose(step, nose) {
  const P = [];
  const add = (ax, ay, bx, by, ra, rb, tint) => P.push([ax, ay, bx, by, ra, rb, tint || 0]);
  const rock = 0.012 * Math.sin(step * 2);                    // a slight waddle
  add(-0.28, 0.2 + rock, 0.18, 0.19 - rock, 0.2, 0.17);       // domed body
  add(0.28, 0.15, 0.56, 0.1 - 0.09 * nose, 0.1, 0.035);       // head tapering to a long snout
  // short legs, stepping in turn
  const l1 = Math.max(0, Math.sin(step)) * 0.05, l2 = Math.max(0, -Math.sin(step)) * 0.05;
  add(-0.24, 0.1, -0.24 + l1, 0.03 + l1, 0.055, 0.05, 2);
  add(0.14, 0.1, 0.14 + l2, 0.03 + l2, 0.055, 0.05, 2);
  // spines: a fan of quills over the back, raked towards the tail
  for (let k = 0; k < 9; k++) {
    const a = (158 - k * 15) * RAD;
    const cxp = -0.05 + 0.2 * Math.cos(a), cyp = 0.2 + rock + 0.17 * Math.sin(a);
    add(cxp, cyp, cxp + 0.2 * Math.cos(a + 0.4), cyp + 0.2 * Math.sin(a + 0.4), 0.036, 0.012, 1);
  }
  P.eyes = [[0.31, 0.19]];
  return P;
}

function drawEchidna(t, dt) {
  if (!CONFIG.echidna || reducedMotion) return;
  if (nextEchidna < 0) nextEchidna = t + 14 + Math.random() * 10;
  if (!echidna) {
    if (t < nextEchidna || !cols) return;
    const dir = Math.random() < 0.5 ? 1 : -1;
    const S = ch * 10;
    echidna = { dir: dir, S: S, x: dir > 0 ? -0.7 * S : W + 0.7 * S, step: 0, nose: 0, seed: Math.random() * 50 };
  }
  const E = echidna, C = CONFIG.colors, S = E.S;
  // stop and snuffle every so often
  const snuffling = noise3(t * 0.22, E.seed, 3.3) > 0.64;
  E.nose += ((snuffling ? 1 : 0) - E.nose) * Math.min(1, dt * 4);
  const speed = 36 * (1 - E.nose);                            // pixels per second
  E.x += E.dir * speed * dt;
  E.step += speed * dt / S * 16;
  if (E.x > W + 0.8 * S || E.x < -0.8 * S) {
    echidna = null;
    const e = CONFIG.echidnaEvery;
    nextEchidna = t + e[0] + Math.random() * (e[1] - e[0]);
    return;
  }
  // it walks on the slope in front of the main tree's line
  const gy = (groundRow - Math.max(1, groundUp(E.x / cw, -0.2))) * ch;
  const P = echidnaPose(E.step, E.nose + (snuffling ? 0.25 * Math.sin(t * 9) : 0));
  paintShape(P, E.x, gy, S, E.dir,
             Math.floor((E.x - 0.75 * S) / cw), Math.ceil((E.x + 0.75 * S) / cw),
             Math.floor((gy - 0.7 * S) / ch), rows - 1,
             [C.echidna, C.echidnaSpine, C.echidnaDark], P.eyes, C.echidnaDark);
}

/* The distant rocky hill. hill2H is its height in rows above the top of
   the main slope, for each column; farRocks are the small trees on its skyline. */
function buildRockyHill() {
  hill2H = new Float32Array(cols);
  farRocks = [];
  if (!CONFIG.rockyHill) return;
  const right = CONFIG.rockyHillSide !== 'left';
  const side = x => right ? x : 1 - x;
  for (let i = 0; i < cols; i++) {
    const xs = (side(i / Math.max(1, cols - 1)) - 0.44) / 0.56;      // 0 where it starts .. 1 at the screen edge
    if (xs <= 0) continue;
    const dome = Math.pow(Math.sin(Math.PI * 0.62 * xs), 1.15);       // rises, peaks, eases off
    const crag = 3.2 * noise3(i * 0.06, 31.1, 0) + 1.6 * noise3(i * 0.27, 32.4, 0) - 2.4;
    hill2H[i] = Math.max(0, rows * 0.4 * CONFIG.rockyHillSize * dome + crag * Math.min(1, xs * 5));
  }
  // small Callitris standing along its skyline, seen as silhouettes
  const spots = [0.60, 0.67, 0.695, 0.76, 0.80, 0.815, 0.86, 0.915, 0.94, 0.985];
  spots.forEach((fx, n) => {
    const x = Math.round(cols * side(fx));
    const base = hill2H[Math.max(0, Math.min(cols - 1, x))];
    if (base < 2) return;
    const h = (3.2 + 4.3 * hash3(n, 1, 95)) * CONFIG.rockyHillSize;       // rows tall
    farRocks.push({ x: x, y: base - 0.6, h: h, w: 0.9 + h * (0.2 + 0.1 * hash3(n, 2, 95)), n: n });
  });
}

function farRockAt(i, upB) {
  for (let k = 0; k < farRocks.length; k++) {
    const R = farRocks[k];
    const dx = i - R.x;
    if (dx > R.w || dx < -R.w) continue;
    const f = (upB - R.y) / R.h;                      // 0 at its foot, 1 at its tip
    if (f <= 0 || f > 1) continue;
    // the same narrow outline as the trees in front: nearly parallel sides, pointed top
    const half = R.w * Math.pow(f, 0.25) * Math.pow(1 - f, 0.6) * 1.35;
    if (Math.abs(dx) > half + 0.35) continue;
    const h = hash3(i, Math.round(upB), 96 + R.n);
    if (f > 0.85) rC = h < 0.5 ? '|' : '!';
    else if (Math.abs(dx) > half - 0.6) rC = dx < 0 ? (h < 0.5 ? '/' : ';') : (h < 0.5 ? '\\' : ';');
    else rC = h < 0.35 ? 'i' : h < 0.6 ? '!' : h < 0.8 ? 'l' : ';';
    rColor = CONFIG.colors.farCallitris[dx < 0 ? 1 : 0];
    return true;
  }
  return false;
}

/* Boulders and a fallen log on the forest floor. Positions are fractions
   of the width, chosen to sit in the gaps between the trees. */
function buildGround() {
  objects = [];
  colO = new Int16Array(cols).fill(-1);
  if (!CONFIG.groundDetail) return;
  const put = o => {
    for (let i = Math.max(0, Math.floor(o.x - o.rx)); i <= Math.min(cols - 1, Math.ceil(o.x + o.rx)); i++) {
      if (colO[i] < 0) colO[i] = objects.length;
    }
    o.baseRows = Math.round(groundUp(o.x, o.z));
    objects.push(o);
  };
  put({ rock: true, x: cols * 0.05, z: 0.3, rx: 7, ry: 3.2 });
  put({ rock: true, x: cols * 0.05 + 10, z: 0.22, rx: 3.5, ry: 1.7 });
  put({ rock: true, x: cols * 0.825, z: 0.4, rx: 5.5, ry: 2.6 });
  put({ rock: false, x: cols * 0.535, z: 0.12, rx: Math.min(13, cols * 0.07), ry: 2 });
}

function objectAt(i, up) {
  const id = colO[i];
  if (id < 0) return false;
  const o = objects[id], C = CONFIG.colors;
  const dx = i - o.x;
  up -= o.baseRows;                       // rows above where it sits on the slope
  if (up < 1) return false;
  oZ = o.z;
  if (o.rock) {
    const inside = (x, y) => x * x / (o.rx * o.rx) + y * y / (o.ry * o.ry) <= 1;
    if (!inside(dx, up - 0.5)) return false;
    const top = !inside(dx, up + 0.5);
    const edgeL = !inside(dx - 1, up - 0.5), edgeR = !inside(dx + 1, up - 0.5);
    const h = hash3(i, up, 70 + id);
    if (top && !edgeL && !edgeR) { oC = h < 0.8 ? '_' : '.'; oColor = C.rock[2]; }
    else if (edgeL) { oC = top ? '.' : '('; oColor = C.rock[2]; }
    else if (edgeR) { oC = top ? '.' : ')'; oColor = C.rock[0]; }
    else if (h < 0.05) { oC = 'o'; oColor = C.lichen; }                 // lichen
    else if (h < 0.4) { oC = h < 0.2 ? '.' : h < 0.3 ? ':' : ','; oColor = C.rock[dx < 0 ? 1 : 0]; }
    else oC = ' ';
    return true;
  }
  // the log: a lit top edge, a bark-textured side, and a cut end showing
  if (up > 2 || Math.abs(dx) > o.rx) return false;
  const h = hash3(i, up, 80);
  const end = dx < -o.rx + 3;
  if (up === 2) {
    if (end || dx > o.rx - 1) return false;
    oC = h < 0.06 ? '/' : '_'; oColor = C.log[1];
  } else if (end) {
    oC = '(@)'[Math.round(dx + o.rx)] || '('; oColor = C.log[2];
  } else if (dx > o.rx - 1) { oC = ')'; oColor = C.log[0]; }
  else { oC = h < 0.45 ? '=' : h < 0.75 ? '-' : h < 0.9 ? '~' : ':'; oColor = C.log[h < 0.3 ? 1 : 0]; }
  return true;
}

/* ------------------------------------------------------------------
   Two single plants on the slope.
   Grass tree (Xanthorrhoea minor): no trunk above ground, just a dense
   rounded tuft of very fine leaves, with a few tall thin flower stalks,
   each ending in a brown spike.
   Tree fern (Cyathea australis): a rough dark trunk with a crown of long
   arching fronds, the oldest hanging down around it.
   Measurements are in rows of text; sideways distances are converted so
   shapes keep their proportions (one column is narrower than one row).
------------------------------------------------------------------ */
function buildPlants() {
  plantGs = []; plantF = null;
  const C = CONFIG.colors;
  const f = CONFIG.treeFern;
  const STALKS = [{ lean: -0.16, h: 12.5, ph: 0 }, { lean: 0.07, h: 14.5, ph: 2.1 }, { lean: 0.3, h: 10.5, ph: 4.0 }];
  (CONFIG.grassTrees || []).forEach((g, k) => {
    const zc = Math.max(0, g.z), sc = g.size * (1 - 0.62 * zc);
    const L = 5.6 * sc;
    const flip = k % 2 ? -1 : 1;                       // so no two lean the same way
    plantGs.push({
      k: k * 7, x: Math.round(cols * g.x), z: g.z,
      baseRows: Math.max(0, Math.round(groundUp(cols * g.x, g.z))),
      L: L, reach: Math.ceil(L / aspect) + 5, flowering: !!g.flowering,
      // flower stalks: how far each leans, how tall, and a sway offset
      scapes: STALKS.slice(k % 2, (k % 2) + (g.spikes || 0)).map(S => ({ lean: S.lean * flip, h: S.h * sc, ph: S.ph + k })),
      col: C.grassTree.map(c => fade(c, zc * 0.45)),
      stalk: fade(C.grassTreeStalk, zc * 0.45),
      spike: (g.flowering ? C.grassTreeFlower : C.grassTreeSpike).map(c => fade(c, zc * 0.45)),
      straw: C.straw.map(c => fade(c, zc * 0.45))
    });
  });
  plantGs.sort((a, b) => a.z - b.z);                    // nearest first
  if (f) {
    const zc = Math.max(0, f.z), sc = f.size * (1 - 0.62 * zc);
    const fronds = [];
    const N = 13;
    for (let k = 0; k < N; k++) {
      const a = -1.95 + 3.9 * k / (N - 1) + (hash3(k, 1, 120) - 0.5) * 0.16;    // angle from straight up
      const out = Math.abs(a) / 1.95;
      fronds.push({ a: a, len: 9 * sc * (1 - 0.32 * out * out) * (0.88 + 0.24 * hash3(k, 2, 120)), k: k });
    }
    plantF = {
      x: Math.round(cols * f.x), z: f.z, baseRows: Math.max(0, Math.round(groundUp(cols * f.x, f.z))),
      sc: sc, trunkH: 9.5 * sc, L: 9 * sc, fronds: fronds, reach: Math.ceil(10 * sc / aspect) + 3,
      trunk: C.fernTrunk.map(c => fade(c, zc * 0.45)), frond: C.fernFrond.map(c => fade(c, zc * 0.45))
    };
  }
  fernT = -1;
}

// the fern's fronds as rows of points, recalculated once per frame as they stir
function fernFrame(t) {
  const F = plantF, M = 18;
  fernPts = [];
  for (const fr of F.fronds) {
    const droop = (0.026 + 0.032 * Math.abs(fr.a) + 0.006 * Math.sin(t * 1.4 + fr.k * 1.7) * wind) / F.sc;
    let px = 0, py = 0;
    for (let m = 1; m <= M; m++) {
      const f = m / M, s = f * fr.len;
      const x = Math.sin(fr.a) * s + wind * 0.35 * f * f * F.sc;
      const y = Math.cos(fr.a) * s - droop * s * s;
      fernPts.push(x, y, f, x - px, y - py);
      px = x; py = y;
    }
  }
  fernT = t;
}

function plantAt(i, rowsUp, t) {
  /* ---------- grass tree ---------- */
  for (const G of plantGs) {
    const dxc = i - G.x, y = rowsUp - G.baseRows;
    if (y >= 1 && dxc >= -G.reach && dxc <= G.reach) {
      pZ = G.z;
      // leaves: a rounded tuft radiating from one point on the ground
      const push = wind * 0.9 * Math.min(1, y / G.L);                 // leaning in the wind
      const X = (dxc - push) * aspect, Y = y - 0.5;
      const r = Math.sqrt(X * X + Y * Y), ang = Math.atan2(X, Y);    // angle from straight up
      const len = G.L * (0.7 + 0.3 * hash3(Math.floor((ang + 2) * 11), 1, 110 + G.k));
      const leaf = r <= len && hash3(i, rowsUp, 111 + G.k) < 0.96 - 0.34 * (r / len);
      // flower stalks rising through the tuft
      for (let k = 0; k < G.scapes.length; k++) {
        const S = G.scapes[k];
        if (y > S.h) continue;
        const fy = y / S.h;
        const cx = S.lean * y + (wind * 0.5 + Math.sin(t * 1.7 + S.ph) * 0.2 * wind) * fy * fy * 1.6;
        if (Math.round(cx) !== dxc) continue;
        if (fy > 0.6) {                                              // the flower spike itself
          const h = hash3(k, Math.round(y), 112 + G.k);
          pC = h < 0.6 ? '#' : h < 0.85 ? '%' : '*';
          pColor = h < 0.3 ? G.spike[0] : h < 0.85 ? G.spike[1] : G.spike[2];
          return true;
        }
        if (!leaf || y > G.L * 0.55) {                               // bare stalk above the leaves
          pC = S.lean < -0.1 ? '\\' : S.lean > 0.2 ? '/' : '|';
          pColor = G.stalk;
          return true;
        }
      }
      if (leaf) {
        const a = Math.abs(ang);
        pC = a < 0.2 ? '|' : a < 1.12 ? (ang > 0 ? '/' : '\\') : (hash3(i, rowsUp, 113) < 0.5 ? '-' : '_');
        if (r > len - 0.9 && a > 0.5) pC = ang > 0 ? "'" : '`';      // fine leaf tips
        // a skirt of old dead leaves low down on the outside
        if (a > 1.0 && hash3(i, rowsUp, 114) < 0.45) pColor = G.straw[0];
        else pColor = G.col[Math.max(0, Math.min(2, Math.floor(hash3(i, rowsUp, 115) * 1.6 + (ang < 0 ? 0.9 : 0.3) + r / len * 0.5)))];
        return true;
      }
    }
  }

  /* ---------- tree fern ---------- */
  const F = plantF;
  if (F) {
    const dxc = i - F.x, y = rowsUp - F.baseRows;
    if (y >= 1 && dxc >= -F.reach && dxc <= F.reach && y <= F.trunkH + F.L + 1) {
      if (fernT !== t) fernFrame(t);
      const X = (dxc + 0.5) * aspect, Y = y - 0.5 - F.trunkH;        // measured from the top of the trunk
      // nearest point on any frond
      let best = 1e9, bf = 0, bx = 0, by = 0, bY = 0;
      for (let n = 0; n < fernPts.length; n += 5) {
        const ex = X - fernPts[n], ey = Y - fernPts[n + 1];
        const d2 = ex * ex + ey * ey;
        if (d2 < best) { best = d2; bf = fernPts[n + 2]; bx = fernPts[n + 3]; by = fernPts[n + 4]; bY = fernPts[n + 1]; }
      }
      const d = Math.sqrt(best);
      const half = 0.2 + 1.3 * F.sc * Math.pow(Math.sin(Math.PI * Math.pow(bf, 0.75)), 0.8);   // widest mid-frond
      if (d < half) {
        pZ = F.z;
        const flat = Math.abs(bx) > Math.abs(by) * 0.9;              // is this stretch of frond lying flat?
        const h = hash3(i, rowsUp, 121);
        if (d < 0.33) {
          // the midrib
          pC = flat ? (Math.abs(by) < Math.abs(bx) * 0.25 ? '-' : (bx * by > 0 ? '/' : '\\'))
                    : (Math.abs(bx) < Math.abs(by) * 0.3 ? '|' : (bx * by > 0 ? '/' : '\\'));
          pColor = F.frond[1];
          return true;
        }
        if (h < 0.74) {
          // the leaflets, set across the midrib, with gaps so the frond looks lacy
          pC = flat ? ['!', 'i', ':', '|', ';', 'l'][Math.floor(h / 0.74 * 6)] : ['-', '~', '=', ':', '-'][Math.floor(h / 0.74 * 5)];
          pColor = F.frond[Y > bY ? 2 : by < -0.15 ? 0 : 1];         // lit on top, darker where it hangs
          return true;
        }
      }
      // the trunk: rough and fibrous, with stubs of old frond stalks
      if (y <= F.trunkH && dxc >= -1 && dxc <= 1) {
        pZ = F.z;
        const h = hash3(dxc, Math.round(y), 122);
        if (dxc === -1) pC = h < 0.4 ? '\\' : h < 0.75 ? '#' : '%';
        else if (dxc === 1) pC = h < 0.4 ? '/' : h < 0.75 ? '#' : '&';
        else pC = h < 0.4 ? '#' : h < 0.7 ? '%' : h < 0.9 ? '&' : 'X';
        pColor = F.trunk[dxc === -1 ? 2 : dxc === 0 ? 1 : 0];
        return true;
      }
    }
  }
  return false;
}

// A few insects circling each spike that is in flower.
function drawInsects(t) {
  if (!CONFIG.insects || reducedMotion) return;
  for (const G of plantGs) {
    if (!G.flowering) continue;
    G.scapes.forEach((S, n) => {
      // centre of the flowering part of this stalk
      const cxp = (G.x + 0.5 + S.lean * S.h * 0.8) * cw;
      const cyp = (groundRow - G.baseRows - S.h * 0.8) * ch;
      for (let k = 0; k < 3; k++) {
        const a = t * (1.3 + 0.5 * k) + k * 2.1 + n * 1.3 + G.k;
        const x = cxp + (Math.sin(a) * 2.6 + Math.sin(a * 2.7 + k) * 1.2) * cw;
        const y = cyp + (Math.cos(a * 1.3) * 1.6 + Math.sin(a * 3.1 + n) * 0.6) * ch;
        const i = Math.floor(x / cw), j = Math.floor(y / ch);
        ctx.fillStyle = CONFIG.colors.bg;
        ctx.fillRect(i * cw, j * ch, cw, ch);
        ctx.fillStyle = CONFIG.colors.insect;
        ctx.fillText(Math.sin(t * 20 + k * 3) > 0 ? '.' : "'", i * cw, j * ch);
      }
    });
  }
}

/* Tussocks: each is a fan of long strap leaves rising from one point,
   stiff and fairly upright, with the outer leaves shorter. */
function buildTussocks() {
  tussocks = [];
  colT = new Int16Array(cols * SLOTS).fill(-1);
  if (!CONFIG.understory) return;
  const C = CONFIG.colors, list = [];
  const count = Math.round(cols * 0.23);
  for (let n = 0; n < count; n++) {
    const x = Math.floor(hash3(n, 1, 60) * cols);
    // depth: a few in the foreground (z < 0), the rest spread up the slope
    const z = -0.3 + 1.25 * Math.pow(hash3(n, 2, 60), 1.2);
    const zc = z < 0 ? 0 : z;
    const r = hash3(n, 3, 60);
    let h = (2.6 + 4.6 * r * Math.sqrt(r)) * (1 - 0.62 * zc) * (z < 0 ? 1.15 : 1) * CONFIG.understory;
    // smaller close to a trunk at the same depth, so the trees stay readable
    for (const T of trees) {
      if (Math.abs(z - T.distance) < 0.2) h *= Math.min(1, 0.35 + Math.abs(x - T.x) / (14 * T.size));
    }
    if (h < 1.6) continue;
    if (colO[x] >= 0 && Math.abs(z - objects[colO[x]].z) < 0.25) continue;   // not on a boulder or the log
    // leave the grass tree and the tree fern clear so they can be seen
    if (plantGs.some(G => Math.abs(x - G.x) < 13 && Math.abs(z - G.z) < 0.35)) continue;
    if (plantF && Math.abs(x - plantF.x) < 10 && z < plantF.z + 0.08) continue;
    list.push({
      x: x, z: z, h: h, w: h * (0.7 + 0.5 * hash3(n, 4, 60)),
      baseRows: Math.max(0, Math.round(groundUp(x, z))),
      flower: hash3(n, 5, 60) < 0.3,
      shrub: C.shrub.map(c => fade(c, zc * 0.5)), straw: C.straw.map(c => fade(c, zc * 0.5))
    });
  }
  list.sort((a, b) => a.z - b.z);                  // nearest first
  for (const K of list) {
    const reach = Math.ceil(K.w) + 5;
    for (let i = Math.max(0, K.x - reach); i <= Math.min(cols - 1, K.x + reach); i++) {
      for (let s = 0; s < SLOTS; s++) if (colT[i * SLOTS + s] < 0) { colT[i * SLOTS + s] = tussocks.length; break; }
    }
    tussocks.push(K);
  }
}

function tussockAt(i, rowsUp, t) {
  for (let s = 0; s < SLOTS; s++) {
    const id = colT[i * SLOTS + s];
    if (id < 0) break;
    const K = tussocks[id];
    const up = rowsUp - K.baseRows;                   // rows above where it stands on the slope
    if (up < 1 || up > K.h) continue;
    const f = up / K.h;                               // 0 at the base, 1 at the leaf tips
    // leaves flex in the wind, the tips most of all
    const dx = i - K.x - (wind * 0.9 + Math.sin(t * 1.3 + K.x) * 0.25 * wind) * f * f * K.h * 0.22;
    const spread = 0.6 + K.w * Math.pow(f, 0.75);     // the fan opens out as it rises
    const a = Math.abs(dx) / spread;
    if (a > 1) continue;
    const e = Math.abs(dx) / K.w;
    const top = 1 - 0.4 * e * e;                      // outer leaves are shorter
    if (f > top) continue;
    const hx = Math.round(dx) + K.x * 3;
    if (hash3(hx, up, 8) > 0.97 - 0.42 * a - 0.12 * f) continue;    // ragged, more so outwards
    const slope = dx / up;
    sC = slope < -0.4 ? '\\' : slope > 0.4 ? '/' : '|';
    if (f > top - 1.1 / K.h && e > 0.5) sC = dx < 0 ? '`' : "'";    // thin leaf tips
    sZ = K.z;
    // dead straw-coloured leaves, mostly low down in the tussock
    if (hash3(hx, up, 9) < 0.1 + 0.28 * (1 - f)) sColor = K.straw[hash3(hx, up, 10) < 0.5 ? 0 : 1];
    else sColor = K.shrub[Math.max(0, Math.min(2, Math.floor(f * 1.5 + hash3(hx, up, 11) * 1.5 - (dx > 0 ? 0.4 : 0))))];
    // an old flower spike or two standing among the leaves
    if (K.flower && Math.abs(dx - 1) < 0.6 && f > 0.5 && f < 0.92) {
      sC = hash3(hx, up, 12) < 0.55 ? '*' : '!'; sColor = K.straw[1];
    }
    return true;
  }
  return false;
}

/* What, if anything, of a background tree is in this cell?
   0 = nothing, 1 = trunk, 2 = shaded crown, 3 = lit crown */
function midAt(i, up, t, wind) {
  for (let m = 0; m < midTrees.length; m++) {
    const T = midTrees[m];
    const far = i - T.x;
    if (far > T.rx + 8 || far < -T.rx - 8) continue;
    const f = up / T.h;
    const dx = far - T.lean * up - wind * 1.6 * f * f;
    const ey = (up - T.h) / T.ry;
    if (ey > -1.3 && ey < 1) {
      const ex = dx / T.rx;
      const r = ex * ex + ey * ey;
      if (r < 1) {
        const nn = noise3(dx * 0.33 + T.k * 13, up * 0.5, t * 0.18 + T.k);
        if (nn > 0.36 + r * 0.26) return nn > 0.6 ? 3 : 2;
      }
    }
    if (up < T.h && Math.abs(dx) < (T.wide && f < 0.5 ? 1 : 0.5)) return 1;
  }
  return 0;
}

/* ------------------------------------------------------------------
   Wind
------------------------------------------------------------------ */
let wind = 0.3;         // current wind, roughly -2..2 (positive = to the right)
let windPhase = 0;      // accumulated wind, used to drift the air streaks
let pointer = 0, pointerTarget = 0;
let lastT = 0;

if (CONFIG.pointerWind) {
  window.addEventListener('pointermove', e => {
    pointerTarget = (e.clientX / (W || 1) - 0.5) * 3;
  });
  document.addEventListener('pointerleave', () => { pointerTarget = 0; });
}
canvas.addEventListener('click', () => spawnWallaby(lastT));

/* ------------------------------------------------------------------
   One frame. Like the ASCII playground, every cell of the grid asks
   "what am I?" and answers with one character and one colour.
------------------------------------------------------------------ */
function draw(t) {
  const C = CONFIG.colors;
  const dt = Math.max(0, Math.min(0.1, t - lastT));
  lastT = t;

  // slow gusts + quicker flutter + the mouse
  pointer += (pointerTarget - pointer) * 0.04;
  const gust = noise3(t * 0.13, 3.1, 0.5) * 2 - 1;
  const flutter = noise3(t * 0.7, 9.7, 0.5) * 2 - 1;
  let target = (0.3 + 0.9 * gust + 0.25 * flutter) * CONFIG.wind + pointer;
  target = Math.max(-2.2, Math.min(2.2, target));
  wind += (target - wind) * 0.06;
  windPhase += wind * dt * 0.5;

  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  let lastColor = '';

  for (let j = 0; j < rows; j++) {
    const up = groundRow - j;                    // rows above the bottom of the scene

    for (let i = 0; i < cols; i++) {
      let c = ' ', color = C.air;
      const crest = crestUp[i];

      // what stands in this cell? trees (nearest first), a tussock, a boulder or the log
      let best = 0, zBest = 9, d = -1;
      for (let k = 0; k < trees.length; k++) {
        const T = trees[k];
        const found = treeAt(T, i, j, t);
        if (tD > d) d = tD;
        if (found) { best = 1; zBest = T.distance; break; }
      }
      // ...whichever of them is closest to the viewer is the one you see
      if (tussockAt(i, up, t) && sZ < zBest) { best = 2; zBest = sZ; }
      if (objectAt(i, up) && oZ < zBest) { best = 3; zBest = oZ; }
      if (plantAt(i, up, t) && pZ < zBest) best = 4;

      if (best === 1) { c = tC; color = tColor; }
      else if (best === 2) { c = sC; color = sColor; }
      else if (best === 3) { c = oC; color = oColor; }
      else if (best === 4) { c = pC; color = pColor; }
      else if (up <= crest) {
        /* ---------- the sloping forest floor ---------- */
        const fr = frontUp[i];
        const z = (up - fr) / (crest - fr);          // 0 at the main tree, 1 at the top of the slope
        const f = z < 0 ? 0 : z;
        const bin = Math.min(DEPTH_BINS - 1, Math.floor(f * DEPTH_BINS));
        if (up > crest - 1) {
          // the top edge of the hill, slightly brighter so the slope reads against the forest
          const h = hash3(i, j, 5);
          if (h < 0.88) { c = h < 0.45 ? '_' : h < 0.65 ? '.' : h < 0.8 ? '-' : ','; color = C.crest; }
        } else if (hash3(i, j, 6) < 0.02 + 0.12 * (1 - f) * (1 - f) + (z < 0 ? 0.05 : 0)) {
          // blades of grass, thinning out with distance
          const lw = wind + (noise3(i * 0.15 - windPhase * 2, j * 0.5, t * 0.4) - 0.5) * 1.6;
          c = lw > 0.45 ? '/' : lw < -0.45 ? '\\' : '|';
          if (hash3(i, j, 2) < 0.3) c = lw > 0 ? ',' : "'";
          color = grassPal[bin];
        } else {
          // leaf litter, in faint bands that follow the lie of the land
          const band = Math.sin(z * 24 + noise3(i * 0.06, 3.3, 0) * 2.5);
          const h = hash3(i, j, 5);
          if (h < 0.07 + 0.15 * (1 - f) + 0.09 * band) {
            const set = f < 0.45 ? LITTER_NEAR : LITTER_FAR;
            c = set[Math.floor(hash3(i, j, 4) * set.length)];
            color = groundPal[bin];
          }
        }
      } else {
        /* ---------- behind the hill: background trees, air, distant canopy, sky ---------- */
        const upB = up - crest;                      // rows above the top of the slope
        let mid = 0;
        if (d < 0 && (mid = midAt(i, upB, t, wind))) {
          if (mid === 1) {
            c = hash3(i, j >> 1, 10) < 0.8 ? '|' : ':';
            color = C.midTrunk;
          } else {
            c = CROWN_CH[Math.floor(hash3(i, j, 11) * CROWN_CH.length)];
            color = C.midCrown[mid - 2];
          }
        } else {
          // faint streaks of moving air
          const a = noise3(i * 0.05 - windPhase, j * 0.8, t * 0.07);
          if (a > 0.8) { c = a > 0.87 ? '~' : '-'; color = C.air; }
          else if (hash3(i, j, 7) < 0.004) { c = '.'; color = C.air; }

          // the more distant rocky hill, with small Callitris standing on its skyline
          let onHill = false;
          const h2 = hill2H[i];
          if (h2 > 0 && d < 0) {
            if (farRockAt(i, upB)) { onHill = true; c = rC; color = rColor; }
            else if (upB <= h2) {
              onHill = true;
              if (c === ' ') {
                const f = upB / h2;                               // 0 at its foot, 1 at the skyline
                const hh = hash3(i, j, 17);
                if (upB > h2 - 1) {
                  if (hh < 0.9) { c = hh < 0.4 ? '_' : hh < 0.6 ? '.' : hh < 0.8 ? '-' : '^'; color = C.farHill[2]; }
                } else if (noise3(i * 0.17, j * 0.5, 31) > 0.6) {
                  // rock outcrops breaking through
                  if (hh < 0.7) { c = [':', '.', "'", '^', ',', ':', '.'][Math.floor(hh / 0.7 * 7)]; color = C.farHill[1]; }
                } else if (hh < 0.025) { c = hh < 0.012 ? 'i' : '!'; color = C.farScrub; }
                else if (hh < 0.05 + 0.13 * f) { c = '.'; color = C.farHill[0]; }   // scree, thinning into haze at the foot
              }
            }
          }

          // distant canopy: densest at its skyline, thinning into mist below
          if (!onHill && c === ' ' && d < -0.15 && upB <= farH[i]) {
            const f = upB / farH[i];
            const drift = noise3(i * 0.08 + t * 0.03, j * 0.35, t * 0.05);
            if (hash3(i, j, 12) < (0.1 + 0.5 * f * f) * (0.45 + drift)) {
              c = FAR_CH[Math.floor(hash3(i, j, 13) * FAR_CH.length)];
              color = C.far[f > 0.72 ? 1 : 0];
            }
          }

          // a distant hill behind the canopy, and a few stars above it
          if (!onHill && c === ' ' && d < -0.15) {
            const rh = Math.max(ridgeH[i], farH[i]);
            if (upB <= ridgeH[i] && upB > farH[i] * 0.7) {
              const top = upB > ridgeH[i] - 1;
              const hr = hash3(i, j, 15);
              if (hr < (top ? 0.8 : 0.09)) {
                c = top ? (hr < 0.3 ? '.' : hr < 0.55 ? ',' : hr < 0.7 ? ':' : "'") : '.';
                color = C.ridge[top ? 1 : 0];
              }
            } else if (CONFIG.stars && upB > rh) {
              const hs = hash3(i, j, 16);
              if (hs < 0.011) {
                const tw = noise3(i * 7.3, j * 3.1, t * 0.6 + hs * 900);   // twinkle
                if (tw > 0.3) {
                  c = hs < 0.0012 ? '*' : hs < 0.004 ? '+' : '.';
                  color = C.star[tw > 0.62 ? 2 : tw > 0.45 ? 1 : 0];
                }
              }
            }
          }
        }
      }

      // haze lying in the gap behind the slope: it covers the far hill and canopy,
      // but not the trees standing in front of it
      if (CONFIG.mist && best === 0 && up > crest && d < 0) {
        const upB = up - crest;
        if (upB < 11) {
          const m = noise3(i * 0.03 - t * 0.022, upB * 0.3, t * 0.035) * 0.7
                  + noise3(i * 0.11 - t * 0.04, upB * 0.8, 9.2) * 0.3;
          const dens = (m - 0.4) * 2.2 * Math.exp(-upB / 4.5) * CONFIG.mist;
          if (dens > 0.08 && hash3(i, j, 18) < dens * 1.6) {
            c = dens > 0.3 ? (hash3(i, j, 19) < 0.5 ? '=' : '~') : (hash3(i, j, 19) < 0.5 ? '-' : '.');
            color = C.mist[dens > 0.3 ? 1 : 0];
          }
        }
      }

      if (c !== ' ') {
        if (color !== lastColor) { ctx.fillStyle = color; lastColor = color; }
        ctx.fillText(c, i * cw, j * ch);
      }
    }
  }

  drawInsects(t);
  drawFalling(t, dt);
  drawCockatoos(t);
  drawWallaby(t);
  drawEchidna(t, dt);

  if (CONFIG.caption && rows > 4) {
    ctx.fillStyle = C.caption;
    const row = rows - 1;
    for (let k = 0; k < CONFIG.caption.length; k++) {
      ctx.fillText(CONFIG.caption[k], (2 + k) * cw, row * ch);
    }
  }
}

/* ------------------------------------------------------------------
   Run
------------------------------------------------------------------ */
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(resize).observe(canvas);
} else {
  window.addEventListener('resize', resize);
}
resize();

if (!reducedMotion) {
  const frameMs = 1000 / CONFIG.fps;
  let lastFrame = 0;
  const loop = now => {
    requestAnimationFrame(loop);
    if (now - lastFrame < frameMs - 1) return;
    lastFrame = now;
    draw(now / 1000);
  };
  requestAnimationFrame(loop);
}
})();
</script>

<script>
/* ------------------------------------------------------------------
   Page behaviour, separate from the scene: the name settling out of
   foliage characters on load, and the slide-in panels.
------------------------------------------------------------------ */
(() => {
'use strict';
const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const nameEl = document.getElementById('name');
const NAME = nameEl.textContent;
const GLYPHS = '\\/|;:!il%&*';
if (!still) {
  nameEl.setAttribute('aria-label', NAME);
  const t0 = performance.now();
  const tick = now => {
    const done = (now - t0 - 500) / 55;          // letters settled so far
    let out = '';
    for (let k = 0; k < NAME.length; k++) {
      out += k < done || NAME[k] === ' ' ? NAME[k]
           : GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
    }
    nameEl.textContent = out;
    if (done < NAME.length) setTimeout(() => requestAnimationFrame(tick), 45);
  };
  requestAnimationFrame(tick);
}

// panels are opened by #links, so the back button and shared links work
const panels = Array.from(document.querySelectorAll('.panel'));
const links = Array.from(document.querySelectorAll('nav a'));
function show() {
  const id = location.hash.slice(1);
  panels.forEach(p => p.classList.toggle('open', p.id === id));
  links.forEach(a => {
    if (a.getAttribute('href') === '#' + id) a.setAttribute('aria-current', 'true');
    else a.removeAttribute('aria-current');
  });
}
function closePanel() {
  history.pushState('', document.title, location.pathname + location.search);
  show();
}
window.addEventListener('hashchange', show);
links.forEach(a => a.addEventListener('click', e => {
  if (a.getAttribute('aria-current')) { e.preventDefault(); closePanel(); }   // click again to close
}));
panels.forEach(p => p.querySelector('.close').addEventListener('click', closePanel));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && location.hash) closePanel(); });
document.getElementById('tree').addEventListener('click', () => { if (location.hash) closePanel(); });
show();
})();
</script>
</body>
